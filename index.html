        const fileDataObj = await readFileAsDataUrl(file);
        if (!fileDataObj) return;
        const today = new Date().toISOString().split("T")[0];
        const newDoc = {
          id: "doc-direct-" + Date.now(),
          fileName: fileDataObj.name,
          mimeType: fileDataObj.mimeType,
          dataUrl: fileDataObj.dataUrl,
          documentType: "UPLOADED_DOCUMENT",
          linkedTo: "Manual Vault Upload",
          fileSize: fileDataObj.sizeKb,
          uploadedAt: today,
        };
        commitDb({ ...db, documents: [newDoc, ...db.documents] }, `Uploaded ${newDoc.fileName}`);
        setViewingDoc(newDoc);

      function handleExportFullBusinessZip() {

        const url = URL.createObjectURL(blob);

        a.href = url;

      async function handleImportFullBusinessFolderOrZip(e) {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        try {
          // Case 1: User selected a .zip folder backup
          const zipFile = files.find((f) => f.name.toLowerCase().endsWith(".zip"));
          if (zipFile) {
            const arrayBuf = await zipFile.arrayBuffer();
            const restoredDb = extractMasterJsonFromZipBuffer(arrayBuf);
            commitDb(restoredDb, "Restored Full Business ZIP Folder Backup");
            alert("Full Business Folder (.ZIP) restored! All Accounts, Stock, Sales & Documents are back.");
            return;
          }

          // Case 2: User selected an unzipped folder or .json archive file
          const masterJsonFile =
            files.find((f) => f.name.includes("MASTER-RESTORE-ARCHIVE")) ||
            files.find((f) => f.name.toLowerCase().endsWith(".json"));

          if (masterJsonFile) {
            const text = await masterJsonFile.text();
            const parsed = JSON.parse(text);
            if (parsed && parsed.inventory && parsed.sales) {
              commitDb(parsed, "Restored Full Business Backup");
              alert("Full Business Backup restored! All Accounts, Stock, Sales & Documents are back.");
              return;
            }
          }

          alert("Could not find a valid TPCG Backup (.zip or MASTER-RESTORE-ARCHIVE.json) in selection.");
        } catch (err) {
          alert("Restore failed: " + (err.message || "Invalid backup file format."));
        }
      }

      function downloadUkAccountantCsv() {
        const headers = [
          "Sale Date",
          "14-Day Payout Due Date",
          "SKU",
          "Item Title",
          "Qty Sold",
          "Acquisition Type",
          "Consignee Name",
          "Gross Sale (GBP)",
          "Shipping Charged (GBP)",
          "Transaction Fee (GBP)",
          "Promoted Ad Fee (GBP)",
          "Actual Postage (GBP)",
          "Packaging Cost (GBP)",
          "Owned Stock Buy-In Cost / COGS (GBP)",
          "Return Postage Charged (GBP)",
          "eBay Return Credit (GBP)",
          "Item True Net Profit (GBP)",
          "Consignee 60% Payout (GBP)",
          "Paid So Far (GBP)",
          "Taxable Business Profit Share (GBP)",
          "Payout Status",
        ];

        const rows = sortedSales.map((s) => {
          const consignee = db.consignees.find((c) => c.id === s.consigneeId);
          return [
            s.saleDate,
            s.payoutDueDate || addDaysToIso(s.saleDate, 14),
            s.sku || "",
            `"${(s.title || "").replace(/"/g, '""')}"`,
            s.quantitySold ?? 1,
            s.acquisitionType || "",
            `"${consignee ? consignee.name : "N/A - Owned Stock"}"`,
            Number(s.grossSalePrice || 0).toFixed(2),
            Number(s.shippingChargedToBuyer || 0).toFixed(2),
            Number(s.platformFeeAmount || 0).toFixed(2),
            Number(s.adFeeAmount || 0).toFixed(2),
            Number(s.actualPostageCost || 0).toFixed(2),
            Number(s.packagingCost || 0).toFixed(2),
            Number(s.ownedStockCogs || 0).toFixed(2),
            Number(s.returnPostageCost || 0).toFixed(2),
            Number(s.returnEbayCredit || 0).toFixed(2),
            Number(s.netProfit || 0).toFixed(2),
            Number(s.consigneePayoutAmount || 0).toFixed(2),
            Number(s.amountPaidSoFar || 0).toFixed(2),
            Number(s.businessProfitShare || 0).toFixed(2),
            s.payoutStatus,
          ];
        });

        const csvContent = [headers.join(","), ...rows.map((r) => r.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `tpcg-uk-tax-export-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function handleDeletePayout(payoutId) {
        if (!confirm("Delete this Payout record and restore its unpaid balance on the linked sales?")) return;
        const targetPo = db.payouts.find((p) => p.id === payoutId);
        const allocationMap = targetPo?.allocationsBySaleId || {};

        const restoredSales = db.sales.map((s) => {
          const refundedPart = Number(allocationMap[s.id] || 0);
          if (refundedPart <= 0 && s.payoutId !== payoutId) return s;
          const nextPaid = Math.max(0, toGbp(toPence(s.amountPaidSoFar || 0) - toPence(refundedPart)));
          return {
            ...s,
            amountPaidSoFar: nextPaid,
            payoutStatus: nextPaid > 0 ? "PART_PAID" : "UNPAID",
            payoutId: null,
          };
        });

        commitDb(
          {
            ...db,
            sales: restoredSales,
            payouts: db.payouts.filter((p) => p.id !== payoutId),
            cashFlow: db.cashFlow.filter((cf) => cf.payoutId !== payoutId),
          },
          `Deleted Payout ${targetPo?.payoutNumber || ""}`
        );
      }

                          <td className="py-1.5 text-rose-600">-{fmtGBP(it.deductions)}</td>
                          <td className="py-1.5">{fmtGBP(it.netProfit)}</td>
                          <td className="py-1.5">{fmtGBP(it.consigneeShare60)}</td>
                          <td className="py-1.5 text-right font-bold text-indigo-700">
                            {fmtGBP(it.paidThisBatch ?? it.consigneeShare60)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <p className="text-right font-black text-base mt-3 border-t-2 border-slate-900 pt-2">
                    TOTAL PAYOUT TRANSFERRED: {fmtGBP(statementModalPayout.totalPayoutAmount)}
                  </p>
                </div>
                <div className="flex justify-end gap-2 mt-4 no-print">
                  <button
                    onClick={() => setStatementModalPayout(null)}
                    className="px-4 py-2 text-xs text-slate-600"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                  >
                    Print / Save PDF
                  </button>
                </div>
              </div>
            </div>
          )}

          {labelModalItems && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl max-w-3xl w-full p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 no-print">
                  <h3 className="font-bold">Printable SKU Barcode Labels ({labelModalItems.length})</h3>
                  <div className="flex gap-2">
                    <button onClick={() => setLabelModalItems(null)} className="px-3 py-1.5 text-xs">
                      Close
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="bg-indigo-600 text-white text-xs px-4 py-1.5 rounded-lg"
                    >
                      🖨️ Print
                    </button>
                  </div>
                </div>
                <div className="printable-area grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {labelModalItems.map((item) => (
                    <div key={item.id} className="label-card-print border-2 border-black rounded-xl p-3">
                      <div className="flex justify-between text-[10px] font-bold border-b border-black pb-1">
                        <span>THAT POP CULTURE GUY</span>
                        <span>
                          BIN: {item.storageLocation || "VAULT-A1"} • QTY: {item.quantity ?? 1}
                        </span>
                      </div>
                      <p className="text-xs font-bold my-1">{item.title}</p>
                      <div className="flex justify-between text-[10px] text-slate-700 mb-1">
                        <span>COND: {item.condition}</span>
                        <span>{item.acquisitionType}</span>
                      </div>
                      {item.remarks && (
                        <p className="text-[9px] text-slate-600 italic mb-1">
                          Flaws: {item.remarks}
                        </p>
                      )}
                      <div className="flex justify-between items-baseline">
                        <span className="font-mono text-xs font-black">{item.sku}</span>
                        <span className="text-lg font-black">{fmtGBP(item.listedPrice)}</span>
                      </div>
                      <SvgBarcode value={item.sku} />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
