    // ==========================================
    // 15. PART-SETTLEMENT & FORTNIGHTLY PAYOUT MODAL
    // ==========================================
    function SettlePayoutModal({ consignee, unpaidSales, onClose, onConfirmSettlement }) {
      const salesWithMeta = useMemo(() => {
        return unpaidSales.map((s) => {
          const dueIso = s.payoutDueDate || addDaysToIso(s.saleDate, 14);
          const dueMeta = getPayoutDueMeta(dueIso);
          const total60 = Number(s.consigneePayoutAmount || 0);
          const alreadyPaid = Number(s.amountPaidSoFar || 0);
          const remainingOwed = toGbp(Math.max(0, toPence(total60) - toPence(alreadyPaid)));
          return { ...s, dueIso, dueMeta, remainingOwed };
        });
      }, [unpaidSales]);

      const [selectedIds, setSelectedIds] = useState(() =>
        new Set(salesWithMeta.map((s) => s.id))
      );
      const [paymentMethod, setPaymentMethod] = useState("Bank Transfer");
      const [paymentRef, setPaymentRef] = useState(
        `FP-${Math.floor(100000 + Math.random() * 900000)}`
      );

      const selectedMaxOwed = useMemo(() => {
        return toGbp(
          salesWithMeta
            .filter((s) => selectedIds.has(s.id))
            .reduce((acc, s) => acc + toPence(s.remainingOwed), 0)
        );
      }, [salesWithMeta, selectedIds]);

      const [customAmountToPay, setCustomAmountToPay] = useState(selectedMaxOwed);

      useEffect(() => {
        setCustomAmountToPay(selectedMaxOwed);
      }, [selectedMaxOwed]);

      const toggleSaleSelection = (id) => {
        const next = new Set(selectedIds);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        setSelectedIds(next);
      };

      const selectDueOrOverdueOnly = () => {
        const dueIds = salesWithMeta
          .filter((s) => s.dueMeta.days <= 0)
          .map((s) => s.id);
        if (dueIds.length === 0) {
          alert("No items have passed their 14-day fortnightly payout date yet.");
          return;
        }
        setSelectedIds(new Set(dueIds));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const payNum = Number(customAmountToPay || 0);
        if (payNum <= 0 || selectedIds.size === 0) {
          alert("Please select at least one item and enter a valid payout amount.");
          return;
        }
        onConfirmSettlement({
          consigneeId: consignee.id,
          selectedSaleIds: Array.from(selectedIds),
          amountToPay: Math.min(payNum, selectedMaxOwed),
          paymentReference: `${paymentMethod}: ${paymentRef || "SETTLED"}`,
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 no-print">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <div>
                <h3 className="text-lg font-bold text-white">
                  Settle / Part-Settle Consignee — {consignee.name} (CON-{getConsigneeSkuPrefix(consignee)})
                </h3>
                <p className="text-xs text-slate-400">
                  {consignee.bankDetails} {consignee.paypalEmail ? `• PayPal: ${consignee.paypalEmail}` : ""}
                </p>
              </div>
              <button
                onClick={onClose}
                className="text-xs text-slate-400 hover:text-white px-3 py-1 rounded bg-slate-800"
              >
                ✕
              </button>
            </div>

            <div className="flex flex-wrap gap-2 mb-3 text-xs">
              <button
                type="button"
                onClick={() => setSelectedIds(new Set(salesWithMeta.map((s) => s.id)))}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700"
              >
                Select All Unpaid ({salesWithMeta.length})
              </button>
              <button
                type="button"
                onClick={selectDueOrOverdueOnly}
                className="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-lg font-semibold"
              >
                Select Only Due / Overdue (14+ Days Sold)
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="overflow-x-auto max-h-60 border border-slate-800 rounded-xl">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950 text-slate-400 uppercase sticky top-0">
                    <tr>
                      <th className="py-2 px-2">Pay</th>
                      <th className="py-2 px-2">Sold Date</th>
                      <th className="py-2 px-2">14-Day Due Date</th>
                      <th className="py-2 px-2">SKU & Item (Qty)</th>
                      <th className="py-2 px-2">Net Profit</th>
                      <th className="py-2 px-2 text-right">Remaining 60% Owed</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {salesWithMeta.map((s) => (
                      <tr key={s.id} className="hover:bg-slate-800/40">
                        <td className="py-2.5 px-2">
                          <input
                            type="checkbox"
                            checked={selectedIds.has(s.id)}
                            onChange={() => toggleSaleSelection(s.id)}
                            className="rounded"
                          />
                        </td>
                        <td className="py-2.5 px-2 text-slate-300 whitespace-nowrap">{s.saleDate}</td>
                        <td className="py-2.5 px-2 whitespace-nowrap">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-semibold ${s.dueMeta.badgeClass}`}>
                            {s.dueMeta.label}
                          </span>
                        </td>
                        <td className="py-2.5 px-2 text-white">
                          <span className="font-mono text-indigo-400 mr-1.5">{s.sku}</span>
                          {s.title} <span className="text-amber-300 font-bold">(x{s.quantitySold || 1})</span>
                        </td>
                        <td className="py-2.5 px-2 text-slate-300">{fmtGBP(s.netProfit)}</td>
                        <td className="py-2.5 px-2 text-right font-bold text-indigo-300">
                          {fmtGBP(s.remainingOwed)}
                          {Number(s.amountPaidSoFar || 0) > 0 && (
                            <span className="block text-[10px] text-emerald-400">
                              (Paid so far: {fmtGBP(s.amountPaidSoFar)})
                            </span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs">
                <div>
                  <label className="text-slate-400 block mb-1">
                    Amount to Pay Now (£) — Max: {fmtGBP(selectedMaxOwed)}
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    max={selectedMaxOwed}
                    value={customAmountToPay}
                    onChange={(e) => setCustomAmountToPay(e.target.value)}
                    className="w-full bg-slate-900 border border-indigo-500/50 rounded-lg px-3 py-2 text-base font-bold text-emerald-400"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Clause 4 Payment Method</label>
                  <select
                    value={paymentMethod}
                    onChange={(e) => setPaymentMethod(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                  >
                    <option value="Bank Transfer">UK Bank Transfer</option>
                    <option value="PayPal">PayPal Transfer</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Payment Reference</label>
                  <input
                    type="text"
                    required
                    value={paymentRef}
                    onChange={(e) => setPaymentRef(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"
                  />
                </div>
              </div>

              <div className="flex justify-end gap-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-xs text-slate-400">
                  Cancel
                </button>
                <button
                  type="submit"
                  className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow"
                >
                  Confirm Payout ({fmtGBP(customAmountToPay)}) & Generate Statement
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 16. BUILT-IN DOCUMENT & RECEIPT VIEWER MODAL
    // ==========================================
    function DocumentViewerModal({ doc, onClose }) {
      if (!doc) return null;
      const isImage =
        (doc.mimeType && doc.mimeType.startsWith("image/")) ||
        /\.(jpg|jpeg|png|webp|gif)$/i.test(doc.fileName || "");
      const isPdf =
        doc.mimeType === "application/pdf" || /\.pdf$/i.test(doc.fileName || "");

      return (
        <div className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 no-print">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full p-6 max-h-[92vh] flex flex-col">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
              <div>
                <h3 className="text-base font-bold text-white">{doc.fileName}</h3>
                <p className="text-xs text-slate-400">
                  {doc.linkedTo} • {doc.documentType} • Uploaded {doc.uploadedAt}
                </p>
              </div>
              <div className="flex items-center gap-2">
                {doc.dataUrl && (
                  <a
                    href={doc.dataUrl}
                    download={doc.fileName}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg"
                  >
                    ⬇ Download File
                  </a>
                )}
                <button
                  onClick={onClose}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg"
                >
                  ✕ Close
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-center min-h-[320px]">
              {!doc.dataUrl ? (
                <div className="text-center text-xs text-slate-400 p-6">
                  <p className="text-sm font-semibold text-white mb-1">Metadata Record Only</p>
                  <p>This document record was logged without an embedded file attachment.</p>
                </div>
              ) : isImage ? (
                <img
                  src={doc.dataUrl}
                  alt={doc.fileName}
                  className="max-h-[65vh] max-w-full object-contain rounded-lg"
                />
              ) : isPdf ? (
                <iframe
                  src={doc.dataUrl}
                  title={doc.fileName}
                  className="w-full h-[65vh] rounded-lg border-0 bg-white"
                />
              ) : (
                <div className="text-center text-xs text-slate-300 p-6">
                  <p className="mb-3">
                    File ready for inspection: <strong>{doc.fileName}</strong>
                  </p>
                  <a
                    href={doc.dataUrl}
                    download={doc.fileName}
                    className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold inline-block"
                  >
                    Download / Open on Device
                  </a>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 17. MULTI-QUANTITY RECORD SALE MODAL
    // Sell 1 out of 60 -> keeps 59 in Stock & moves 1 to Sold
    // ==========================================
    function RecordSaleModal({ item, consignees, onClose, onConfirm }) {
      const initialPreset = UK_PLATFORM_PRESETS[item.platform] ? item.platform : "EBAY";
      const maxQty = Math.max(1, Number(item.quantity ?? 1));
      const [quantitySold, setQuantitySold] = useState(1);
      const [preset, setPreset] = useState(initialPreset);
      const [gross, setGross] = useState(item.listedPrice);
      const [shippingCharged, setShippingCharged] = useState(3.99);
      const [platformFee, setPlatformFee] = useState(() =>
        calculatePlatformFeeByPreset(initialPreset, item.listedPrice, 3.99)
      );
      const [adFeePct, setAdFeePct] = useState(0);
      const [adFeeAmount, setAdFeeAmount] = useState(0);
      const [actualPostage, setActualPostage] = useState(3.29);
      const [packagingCost, setPackagingCost] = useState(0.85);
      const [unitBuyInCost, setUnitBuyInCost] = useState(Number(item.acquisitionCost || 0));
      const [buyerUsername, setBuyerUsername] = useState("");
      const [saleDate, setSaleDate] = useState(new Date().toISOString().split("T")[0]);
      const [proofFileObj, setProofFileObj] = useState(null);

      const consignee = consignees.find((c) => c.id === item.consigneeId);
      const remainingStockAfterSale = Math.max(0, maxQty - Number(quantitySold || 1));

      const recalcFees = (nextPreset, nextGross, nextShip, nextAdPct) => {
        const g = Number(nextGross) || 0;
        const s = Number(nextShip) || 0;
        if (nextPreset !== "CUSTOM") {
          setPlatformFee(calculatePlatformFeeByPreset(nextPreset, g, s));
        }
        if (nextAdPct !== "CUSTOM") {
          setAdFeeAmount(Number((((g + s) * (Number(nextAdPct) || 0)) / 100).toFixed(2)));
        }
      };

      const handleQtySoldChange = (val) => {
        const cleanQ = Math.min(maxQty, Math.max(1, Number(val || 1)));
        setQuantitySold(cleanQ);
        const nextGross = Number((Number(item.listedPrice || 0) * cleanQ).toFixed(2));
        setGross(nextGross);
        recalcFees(preset, nextGross, shippingCharged, adFeePct);
      };

      const handlePresetChange = (newPreset) => {
        setPreset(newPreset);
        recalcFees(newPreset, gross, shippingCharged, adFeePct);
      };

      const handleGrossChange = (val) => {
        setGross(val);
        recalcFees(preset, val, shippingCharged, adFeePct);
      };

      const handleShippingChange = (val) => {
        setShippingCharged(val);
        recalcFees(preset, gross, val, adFeePct);
      };

      const handleAdPctQuickTap = (pct) => {
        setAdFeePct(pct);
        const total = (Number(gross) || 0) + (Number(shippingCharged) || 0);
        setAdFeeAmount(Number(((total * pct) / 100).toFixed(2)));
      };

      const handleProofUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const dataObj = await readFileAsDataUrl(file);
        setProofFileObj(dataObj);
      };

      const totalCogsForSale = useMemo(
        () => Number((Number(unitBuyInCost || 0) * Number(quantitySold || 1)).toFixed(2)),
        [unitBuyInCost, quantitySold]
      );

      const splitPreview = useMemo(
        () =>
          calculateSaleSplit({
            acquisitionType: item.acquisitionType,
            grossSalePrice: gross,
            shippingChargedToBuyer: shippingCharged,
            platformFeeAmount: platformFee,
            adFeeAmount,
            actualPostageCost: actualPostage,
            packagingCost,
            acquisitionCost: totalCogsForSale,
            consigneeSplitPercentage: consignee ? Number(consignee.defaultSplit) : 60,
          }),
        [item, consignee, gross, shippingCharged, platformFee, adFeeAmount, actualPostage, packagingCost, totalCogsForSale]
      );

      const minReserveTotal = Number(item.minimumReserve || 0) * Number(quantitySold || 1);
      const isBelowMinimumReserve =
        item.acquisitionType === "CONSIGNMENT" &&
        minReserveTotal > 0 &&
        splitPreview.consigneePayoutAmount < minReserveTotal;

      const duePreviewDate = useMemo(() => addDaysToIso(saleDate, 14), [saleDate]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const qSold = Math.min(maxQty, Math.max(1, Number(quantitySold || 1)));
        onConfirm({
          saleDate,
          payoutDueDate: duePreviewDate,
          quantitySold: qSold,
          unitBuyInCost: Number(unitBuyInCost || 0),
          grossSalePrice: Number(gross),
          shippingChargedToBuyer: Number(shippingCharged || 0),
          platformFeeAmount: Number(platformFee || 0),
          adFeeAmount: Number(adFeeAmount || 0),
          actualPostageCost: Number(actualPostage || 0),
          packagingCost: Number(packagingCost || 0),
          buyerUsername: buyerUsername || "uk_collector_buyer",
          proofFileObj,
        });
      };

      return (
        <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 no-print">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 max-h-[92vh] overflow-y-auto">
            <h3 className="text-lg font-bold text-white mb-1">
              Move Stock to Sold & Calculate Profit
            </h3>
            <p className="text-xs text-indigo-300 mb-3">
              [{item.sku}] {item.title} • Currently <strong>{maxQty}</strong> in Stock
            </p>

            {/* Live Multi-Quantity Stock Deduction Banner */}
            <div className="bg-indigo-950/40 border border-indigo-500/40 rounded-xl p-2.5 mb-3 flex items-center justify-between text-xs">
              <span className="text-indigo-200">
                Selling <strong>{quantitySold}</strong> out of <strong>{maxQty}</strong>:
              </span>
              <span className="font-bold text-emerald-300">
                {remainingStockAfterSale > 0
                  ? `✅ ${remainingStockAfterSale} will remain in Active Stock`
                  : "📦 All units sold — completes stock line"}
              </span>
            </div>

            {isBelowMinimumReserve && (
              <div className="bg-rose-950/60 border border-rose-500/50 rounded-xl p-2.5 mb-3 text-xs text-rose-200">
                ⚠️ <strong>Clause 2 Minimum Reserve Alert:</strong> Consignor 60% payout (
                {fmtGBP(splitPreview.consigneePayoutAmount)}) is below their agreed Minimum Reserve (
                {fmtGBP(minReserveTotal)}).
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3 text-sm">
              <div className="grid grid-cols-3 gap-2.5">
                <div>
                  <label className="text-xs text-slate-400">Qty Sold (Max {maxQty})</label>
                  <input
                    type="number"
                    min="1"
                    max={maxQty}
                    required
                    value={quantitySold}
                    onChange={(e) => handleQtySoldChange(e.target.value)}
                    className="w-full mt-1 bg-slate-950 border border-amber-500/50 rounded-lg px-3 py-1.5 text-amber-300 font-bold"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Fee Preset</label>
                  <select
                    value={preset}
                    onChange={(e) => handlePresetChange(e.target.value)}
                    className="w-full mt-1 bg-slate-950 border border-indigo-500/40 rounded-lg px-2 py-1.5 text-xs text-indigo-200 font-medium"
                  >
                    {Object.entries(UK_PLATFORM_PRESETS).map(([key, cfg]) => (
                      <option key={key} value={key}>
                        {cfg.shortName}
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Sale Date</label>
                  <input
                    type="date"
                    value={saleDate}
                    onChange={(e) => setSaleDate(e.target.value)}
                    className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400">Total Gross Sale Price (£) *</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    value={gross}
                    onChange={(e) => handleGrossChange(e.target.value)}
                    className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white font-semibold"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Postage Charged to Buyer (£)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={shippingCharged}
                    onChange={(e) => handleShippingChange(e.target.value)}
                    className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                  />
                </div>
              </div>

              {item.acquisitionType === "OWNED_STOCK" && (
                <div className="bg-amber-950/20 border border-amber-500/40 rounded-xl p-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <label className="text-xs font-semibold text-amber-300 block">
                        Unit Buy-In Cost / COGS (£)
                      </label>
                      <span className="text-[11px] text-slate-400">
                        Deducted before calculating your taxable business profit
                      </span>
                    </div>
                    <input
                      type="number"
                      step="0.01"
                      value={unitBuyInCost}
                      onChange={(e) => setUnitBuyInCost(e.target.value)}
                      className="w-28 bg-slate-950 border border-amber-500/50 rounded-lg px-3 py-1.5 text-amber-300 font-bold text-right"
                    />
                  </div>
                </div>
              )}

              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-xs text-slate-400">Promoted Listing / Ad Fee Quick Tap:</span>
                  <div className="flex gap-1">
                    {[0, 2, 5, 8, 10, 12].map((pct) => (
                      <button
                        key={pct}
                        type="button"
                        onClick={() => handleAdPctQuickTap(pct)}
                        className={`px-2 py-0.5 rounded text-[11px] font-semibold ${
                          adFeePct === pct
                            ? "bg-amber-500 text-slate-950"
                            : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                        }`}
                      >
                        {pct}%
                      </button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3 mt-2">
                  <div>
                    <label className="text-[11px] text-slate-400">Transaction Fee (£)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={platformFee}
                      onChange={(e) => {
                        setPreset("CUSTOM");
                        setPlatformFee(e.target.value);
                      }}
                      className="w-full mt-0.5 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-rose-300 font-semibold"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Ad / Promoted Fee (£)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={adFeeAmount}
                      onChange={(e) => {
                        setAdFeePct("CUSTOM");
                        setAdFeeAmount(e.target.value);
                      }}
                      className="w-full mt-0.5 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-amber-300 font-semibold"
                    />
                  </div>

    // ==========================================
    // 19. MAIN APP STATE, AES-256 VAULT & UNDO HISTORY
    // ==========================================
    function App() {
      const [vaultPassphrase, setVaultPassphrase] = useState(() => {
        try {
          return localStorage.getItem("tpcg_custom_pin_v1") || DEFAULT_PASSPHRASE;
        } catch {
          return DEFAULT_PASSPHRASE;
        }
      });

      const [isUnlocked, setIsUnlocked] = useState(false);
      const [vaultErrorShake, setVaultErrorShake] = useState(false);
      const [privacyMaskEnabled, setPrivacyMaskEnabled] = useState(false);

      const [db, setDb] = useState(INITIAL_DATA);
      const [undoHistoryStack, setUndoHistoryStack] = useState([]);
      const [lastActivityTime, setLastActivityTime] = useState(Date.now());

      // Auto-load or migrate legacy storage into AES-256-GCM encrypted vault
      useEffect(() => {
        async function loadVault() {
          try {
            const rawVault = localStorage.getItem(VAULT_STORAGE_KEY);
            if (rawVault) {
              const decrypted = await decryptVaultToDatabase(rawVault, vaultPassphrase);
              if (decrypted && decrypted.inventory) {
                setDb(decrypted);
                setIsUnlocked(true);
                return;
              }
            } else {
              for (const legacyKey of LEGACY_STORAGE_KEYS) {
                const legacyData = localStorage.getItem(legacyKey);
                if (legacyData) {
                  const parsed = JSON.parse(legacyData);
                  if (parsed && parsed.inventory) {
                    setDb(parsed);
                    const enc = await encryptDatabaseToVault(parsed, vaultPassphrase);
                    localStorage.setItem(VAULT_STORAGE_KEY, enc);
                    setIsUnlocked(true);
                    return;
                  }
                }
              }
            }
          } catch (err) {
            console.warn("Vault requires passphrase entry to decrypt.");
          }
        }
        loadVault();
      }, []);

      // Re-encrypt and save to localStorage whenever db or passphrase changes
      useEffect(() => {
        if (!isUnlocked) return;
        async function saveVault() {
          try {
            const cipherPayload = await encryptDatabaseToVault(db, vaultPassphrase);
            localStorage.setItem(VAULT_STORAGE_KEY, cipherPayload);
          } catch (err) {
            console.error("Vault encryption save failed", err);
          }
        }
        saveVault();
      }, [db, vaultPassphrase, isUnlocked]);

      // 5-Minute Inactivity Auto-Lock Timer
      useEffect(() => {
        if (!isUnlocked) return;
        const handleActivity = () => setLastActivityTime(Date.now());
        window.addEventListener("mousemove", handleActivity);
        window.addEventListener("keydown", handleActivity);
        window.addEventListener("touchstart", handleActivity);

        const timer = setInterval(() => {
          if (Date.now() - lastActivityTime > AUTO_LOCK_MS) {
            setIsUnlocked(false);
          }
        }, 30000);

        return () => {
          window.removeEventListener("mousemove", handleActivity);
          window.removeEventListener("keydown", handleActivity);
          window.removeEventListener("touchstart", handleActivity);
          clearInterval(timer);
        };
      }, [isUnlocked, lastActivityTime]);

      const handleUnlockAttempt = async (candidateSecret) => {
        try {
          const rawVault = localStorage.getItem(VAULT_STORAGE_KEY);
          if (!rawVault) {
            if (candidateSecret === DEFAULT_PASSPHRASE || candidateSecret === vaultPassphrase) {
              const cipher = await encryptDatabaseToVault(INITIAL_DATA, candidateSecret);
              localStorage.setItem(VAULT_STORAGE_KEY, cipher);
              setVaultPassphrase(candidateSecret);
              setIsUnlocked(true);
              return;
            } else {
              setVaultErrorShake(true);
              setTimeout(() => setVaultErrorShake(false), 400);
              return;
            }
          }

          const decrypted = await decryptVaultToDatabase(rawVault, candidateSecret);
          if (decrypted && decrypted.inventory) {
            setVaultPassphrase(candidateSecret);
            try {
              localStorage.setItem("tpcg_custom_pin_v1", candidateSecret);
            } catch {}
            setDb(decrypted);
            setIsUnlocked(true);
          } else {
            setVaultErrorShake(true);
            setTimeout(() => setVaultErrorShake(false), 400);
          }
        } catch {
          setVaultErrorShake(true);
          setTimeout(() => setVaultErrorShake(false), 400);
        }
      };

      const handleChangePassphrase = async () => {
        const currentInput = prompt("Enter your current Vault Password or PIN:");
        if (currentInput === null) return;
        if (currentInput !== vaultPassphrase) {
          alert("Incorrect current Password/PIN.");
          return;
        }
        const nextSecret = prompt(
          "Enter a new strong Password, Passphrase, or PIN (at least 4 characters):",
          ""
        );
        if (!nextSecret || nextSecret.trim().length < 4) {
          alert("Password/PIN must be at least 4 characters.");
          return;
        }
        const cleanSecret = nextSecret.trim();
        setVaultPassphrase(cleanSecret);
        try {
          localStorage.setItem("tpcg_custom_pin_v1", cleanSecret);
          const cipher = await encryptDatabaseToVault(db, cleanSecret);
          localStorage.setItem(VAULT_STORAGE_KEY, cipher);
        } catch {}
        alert("AES-256 Vault Password updated and re-encrypted!");
      };

      const handleLockApp = () => {
        setIsUnlocked(false);
      };

      // Global Multi-Step Undo Engine (Stores last 20 snapshots)
      const commitDb = (nextDb, actionLabel = "Action") => {
        setUndoHistoryStack((prev) => [{ snapshot: db, label: actionLabel }, ...prev].slice(0, 20));
        setDb(nextDb);
      };

      const handleGlobalUndo = () => {
        if (undoHistoryStack.length === 0) return;
        const latest = undoHistoryStack[0];
        setUndoHistoryStack((prev) => prev.slice(1));
        setDb(latest.snapshot);
      };

      const [activeTab, setActiveTab] = useState("DASHBOARD");
      const [taxEntityMode, setTaxEntityMode] = useState("SOLE_TRADER");

      // Modals & Viewers State
      const [showAddStockModal, setShowAddStockModal] = useState(false);
      const [addStockInitialConsigneeId, setAddStockInitialConsigneeId] = useState("");
      const [ebayModalMode, setEbayModalMode] = useState(null);
      const [saleModalItem, setSaleModalItem] = useState(null);
      const [returnModalSale, setReturnModalSale] = useState(null);
      const [showAddConsigneeModal, setShowAddConsigneeModal] = useState(false);
      const [showAddExpenseModal, setShowAddExpenseModal] = useState(false);
      const [settleModalConsignee, setSettleModalConsignee] = useState(null);
      const [statementModalPayout, setStatementModalPayout] = useState(null);
      const [contractPrintConsignee, setContractPrintConsignee] = useState(null);
      const [labelModalItems, setLabelModalItems] = useState(null);
      const [editingItem, setEditingItem] = useState(null);
      const [viewingDoc, setViewingDoc] = useState(null);
      const [selectedConsigneeProfileId, setSelectedConsigneeProfileId] = useState(null);
      const [showDeleteEverythingConfirm, setShowDeleteEverythingConfirm] = useState(false);

      // Controlled Sort Code & Account Number for Add Consignee
      const [consigneeSortCode, setConsigneeSortCode] = useState("");
      const [consigneeAccountNum, setConsigneeAccountNum] = useState("");

      // Inventory Filters & Search
      const [stockFilterType, setStockFilterType] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");

      // Live Sandbox Calculator State
      const [calcType, setCalcType] = useState("CONSIGNMENT");
      const [calcPlatformPreset, setCalcPlatformPreset] = useState("EBAY");
      const [calcGross, setCalcGross] = useState(100);
      const [calcShipCharged, setCalcShipCharged] = useState(3.99);
      const [calcFee, setCalcFee] = useState(() => calculatePlatformFeeByPreset("EBAY", 100, 3.99));
      const [calcAdFee, setCalcAdFee] = useState(0);
      const [calcPostage, setCalcPostage] = useState(3.29);
      const [calcPack, setCalcPack] = useState(0.85);
      const [calcCogs, setCalcCogs] = useState(40);

      const handleSandboxPresetChange = (nextPreset) => {
        setCalcPlatformPreset(nextPreset);
        if (nextPreset !== "CUSTOM") {
          setCalcFee(calculatePlatformFeeByPreset(nextPreset, calcGross, calcShipCharged));
        }
      };

      const handleSandboxGrossChange = (val) => {
        setCalcGross(val);
        if (calcPlatformPreset !== "CUSTOM") {
          setCalcFee(calculatePlatformFeeByPreset(calcPlatformPreset, val, calcShipCharged));
        }
      };

      const handleSandboxShipChange = (val) => {
        setCalcShipCharged(val);
        if (calcPlatformPreset !== "CUSTOM") {
          setCalcFee(calculatePlatformFeeByPreset(calcPlatformPreset, calcGross, val));
        }
      };

      const sandboxResult = useMemo(
        () =>
          calculateSaleSplit({
            acquisitionType: calcType,
            grossSalePrice: calcGross,
            shippingChargedToBuyer: calcShipCharged,
            platformFeeAmount: calcFee,
            adFeeAmount: calcAdFee,
            actualPostageCost: calcPostage,
            packagingCost: calcPack,
            acquisitionCost: calcCogs,
          }),
        [calcType, calcGross, calcShipCharged, calcFee, calcAdFee, calcPostage, calcPack, calcCogs]
      );

      // Deep Analytics, Notifications & Strict Realized Tax Aggregations
      const deepStats = useMemo(() => calculateDeepAnalytics(db), [db]);
      const notifications = useMemo(() => buildNotificationsList(db), [db]);

      const metrics = useMemo(() => {
        let consignment40Profit = 0;
        let owned100Profit = 0;
        let unpaidConsignee60Liability = 0;
        let dueWithinFortnightLiability = 0;

        db.sales.forEach((s) => {
          if (s.payoutStatus === "RETURNED") return;
          if (s.acquisitionType === "CONSIGNMENT") {
            consignment40Profit += Number(s.businessProfitShare || 0);
            if (s.payoutStatus !== "PAID") {
              const remOwed = Math.max(
                0,
                Number(s.consigneePayoutAmount || 0) - Number(s.amountPaidSoFar || 0)
              );
              unpaidConsignee60Liability += remOwed;
              const dueIso = s.payoutDueDate || addDaysToIso(s.saleDate, 14);
              const meta = getPayoutDueMeta(dueIso);
              if (meta.days <= 0) {
                dueWithinFortnightLiability += remOwed;
              }
            }
          } else {
            owned100Profit += Number(s.businessProfitShare || 0);
          }
        });

        const deductibleOverheads = db.expenses
          .filter((e) => e.isTaxDeductible && !e.allocatedToItemSale)
          .reduce((acc, e) => acc + Number(e.amount || 0), 0);

        const cashIngoings = db.cashFlow
          .filter((c) => c.type === "INGOING")
          .reduce((acc, c) => acc + Number(c.amount || 0), 0);

        const cashOutgoings = db.cashFlow
          .filter((c) => c.type === "OUTGOING")
          .reduce((acc, c) => acc + Number(c.amount || 0), 0);

        // STRICT HMRC TAX BASIS: Only realized profit from sold items (40% Consignment + 100% Sold Owned)
        const totalBusinessSaleProfit = consignment40Profit + owned100Profit;
        const taxBreakdown = calculateUkTaxLiability(
          totalBusinessSaleProfit,
          deductibleOverheads,
          taxEntityMode
        );

        return {
          consignment40Profit: toGbp(consignment40Profit * 100),
          owned100Profit: toGbp(owned100Profit * 100),
          unpaidConsignee60Liability: toGbp(unpaidConsignee60Liability * 100),
          dueWithinFortnightLiability: toGbp(dueWithinFortnightLiability * 100),
          deductibleOverheads: toGbp(deductibleOverheads * 100),
          cashIngoings: toGbp(cashIngoings * 100),
          cashOutgoings: toGbp(cashOutgoings * 100),
          netCashFlow: toGbp((cashIngoings - cashOutgoings) * 100),
          taxBreakdown,
        };
      }, [db, taxEntityMode]);

      const filteredInventory = useMemo(() => {
        return [...db.inventory]
          .filter((item) => {
            if (stockFilterType !== "ALL" && item.acquisitionType !== stockFilterType) return false;
            if (
              searchQuery &&
              !item.title.toLowerCase().includes(searchQuery.toLowerCase()) &&
              !item.sku.toLowerCase().includes(searchQuery.toLowerCase()) &&
              !(item.remarks || "").toLowerCase().includes(searchQuery.toLowerCase()) &&
              !(item.storageLocation || "").toLowerCase().includes(searchQuery.toLowerCase())
            ) {
              return false;
            }
            return true;
          })
          .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      }, [db.inventory, stockFilterType, searchQuery]);

      const sortedSales = useMemo(() => {
        return [...db.sales].sort((a, b) => (b.saleDate || "").localeCompare(a.saleDate || ""));
      }, [db.sales]);
      // ==========================================
      // 20. MULTI-QUANTITY SYNC, 30-DAY REPRICE, RETURNS & FOLDER BACKUP HANDLERS
      // ==========================================
      function handleBulkEbayImport(rows, confirmedMode, sourceFileObj) {
        let updatedInventory = [...db.inventory];
        const addedStock = [];
        const addedSales = [];
        const addedCashFlow = [];
        const newDocs = [...db.documents];
        const today = new Date().toISOString().split("T")[0];

        rows.forEach((r, idx) => {
          if (r.syncAction === "SKIP_SOLD" || r.syncAction === "SKIP_DUPLICATE") return;

          const skuScan = scanSkuAndMatchConsignee(r.sku, db.consignees);
          const finalSku = skuScan.matched ? skuScan.normalizedSku : r.sku.toUpperCase();
          const isConsignment = r.acquisitionType === "CONSIGNMENT";

          if (confirmedMode === "STOCK") {
            const existingIdx = updatedInventory.findIndex(
              (i) =>
                i.sku.toUpperCase() === finalSku ||
                (r.platformItemId && i.platformItemId !== "N/A" && i.platformItemId === r.platformItemId)
            );
            if (existingIdx !== -1) {
              updatedInventory[existingIdx] = {
                ...updatedInventory[existingIdx],
                quantity: Math.max(1, Number(r.quantity || 1)),
                listedPrice: Number(r.listedPrice),
                title: r.title,
                condition: r.condition || updatedInventory[existingIdx].condition,
                remarks: r.remarks || updatedInventory[existingIdx].remarks || "",
                acquisitionType: r.acquisitionType,
                consigneeId: isConsignment ? r.consigneeId : null,
                acquisitionCost: isConsignment
                  ? 0
                  : Number(r.acquisitionCost ?? updatedInventory[existingIdx].acquisitionCost ?? 0),
              };
            } else {
              addedStock.push({
                id: `inv-eb-${Date.now()}-${idx}`,
                sku: finalSku,
                title: r.title,
                quantity: Math.max(1, Number(r.quantity || 1)),
                category: r.category,
                acquisitionType: r.acquisitionType,
                consigneeId: isConsignment ? r.consigneeId : null,
                acquisitionCost: isConsignment ? 0 : Number(r.acquisitionCost || 0),
                minimumReserve: Number(r.minimumReserve || 0),
                condition: r.condition || ITEM_CONDITIONS[1],
                remarks: r.remarks || "",
                storageLocation: "eBay Vault",
                listedPrice: Number(r.listedPrice),
                status: "ACTIVE",
                platform: "EBAY",
                platformItemId: r.platformItemId,
                createdAt: today,
                lastPriceCheckDate: today,
              });
            }
          } else {
            // SALES MODE: Deduct sold quantity from Stock (e.g. 60 -> 59); only remove when 0
            const soldQty = Math.max(1, Number(r.quantitySold || 1));
            const matchedInvIdx = updatedInventory.findIndex(
              (i) =>
                i.sku.toUpperCase() === finalSku ||
                (r.platformItemId && i.platformItemId !== "N/A" && i.platformItemId === r.platformItemId)
            );

            let matchedStockItem = null;
            if (matchedInvIdx !== -1) {
              matchedStockItem = updatedInventory[matchedInvIdx];
              const currentStockQty = Math.max(1, Number(matchedStockItem.quantity ?? 1));
              const remainingQty = currentStockQty - soldQty;
              if (remainingQty > 0) {
                updatedInventory[matchedInvIdx] = {
                  ...matchedStockItem,
                  quantity: remainingQty,
                };
              } else {
                updatedInventory.splice(matchedInvIdx, 1);
              }
            }

            const finalAcqType = matchedStockItem ? matchedStockItem.acquisitionType : r.acquisitionType;
            const finalConsigneeId =
              finalAcqType === "CONSIGNMENT"
                ? matchedStockItem?.consigneeId || r.consigneeId
                : null;
            const unitCogs =
              finalAcqType === "OWNED_STOCK"
                ? Number(matchedStockItem?.acquisitionCost ?? r.acquisitionCost ?? 0)
                : 0;
            const totalCogsForSale = Number((unitCogs * soldQty).toFixed(2));

            const consigneeObj = db.consignees.find((c) => c.id === finalConsigneeId);
            const split = calculateSaleSplit({
              acquisitionType: finalAcqType,
              grossSalePrice: r.grossSalePrice,
              shippingChargedToBuyer: r.shippingChargedToBuyer,
              platformFeeAmount: r.platformFeeAmount,
              adFeeAmount: r.adFeeAmount || 0,
              actualPostageCost: r.actualPostageCost,
              packagingCost: r.packagingCost,
              acquisitionCost: totalCogsForSale,
              consigneeSplitPercentage: consigneeObj ? Number(consigneeObj.defaultSplit) : 60,
            });

            const saleId = `sale-eb-${Date.now()}-${idx}`;
            const cleanSaleDate = normalizeUkDateToIso(r.saleDate);
            const payoutDueDate = addDaysToIso(cleanSaleDate, 14);

            addedSales.push({
              id: saleId,
              orderNumber: r.orderNumber || "",
              sku: matchedStockItem?.sku || finalSku,
              title: matchedStockItem?.title || r.title,
              quantitySold: soldQty,
              category: matchedStockItem?.category || r.category,
              condition: matchedStockItem?.condition || r.condition,
              remarks: matchedStockItem?.remarks || r.remarks || "",
              storageLocation: matchedStockItem?.storageLocation || "Dispatched",
              platform: "EBAY",
              platformItemId: r.platformItemId,
              acquisitionType: finalAcqType,
              consigneeId: finalConsigneeId,
              listedDate: matchedStockItem?.createdAt || cleanSaleDate,
              saleDate: cleanSaleDate,
              payoutDueDate,
              buyerUsername: r.buyerUsername,
              grossSalePrice: Number(r.grossSalePrice),
              shippingChargedToBuyer: Number(r.shippingChargedToBuyer),
              platformFeeAmount: Number(r.platformFeeAmount),
              adFeeAmount: Number(r.adFeeAmount || 0),
              actualPostageCost: Number(r.actualPostageCost),
              packagingCost: Number(r.packagingCost),
              ownedStockCogs: totalCogsForSale,
              netProfit: split.netProfit,
              businessProfitShare: split.businessProfitShare,
              consigneePayoutAmount: split.consigneePayoutAmount,
              amountPaidSoFar: 0,
              payoutStatus: finalAcqType === "CONSIGNMENT" ? "UNPAID" : "NOT_APPLICABLE",
              payoutId: null,
            });

            addedCashFlow.push({
              id: `cf-eb-in-${Date.now()}-${idx}`,
              entryDate: cleanSaleDate,
              type: "INGOING",
              source: "SALE_GROSS_RECEIPT",
              amount: split.totalIngoing,
              description: `eBay Sale (${soldQty}x): [${matchedStockItem?.sku || finalSku}] ${r.title}`,
              saleRecordId: saleId,
            });

            const directOut = toGbp(
              toPence(r.platformFeeAmount) +
                toPence(r.adFeeAmount || 0) +
                toPence(r.actualPostageCost) +
                toPence(r.packagingCost)
            );
            if (directOut > 0) {
              addedCashFlow.push({
                id: `cf-eb-out-${Date.now()}-${idx}`,
                entryDate: cleanSaleDate,
                type: "OUTGOING",
                source: "PLATFORM_FEE_DEDUCTION",
                amount: directOut,
                description: `Fees, Ad Fee & Postage: [${matchedStockItem?.sku || finalSku}]`,
                saleRecordId: saleId,
              });
            }
          }
        });

        if (sourceFileObj?.name) {
          newDocs.unshift({
            id: "doc-eb-" + Date.now(),
            fileName: sourceFileObj.name,
            mimeType: sourceFileObj.mimeType,
            dataUrl: sourceFileObj.dataUrl,
            documentType: confirmedMode === "SALE" ? "EBAY_SALES_CSV" : "EBAY_STOCK_CSV",
            linkedTo: `Weekly Sync (${rows.length} rows)`,
            fileSize: sourceFileObj.sizeKb || "120 KB",
            uploadedAt: today,
          });
        }

        commitDb(
          {
            ...db,
            inventory: [...addedStock, ...updatedInventory].sort((a, b) =>
              (b.createdAt || "").localeCompare(a.createdAt || "")
            ),
            sales: [...addedSales, ...db.sales].sort((a, b) =>
              (b.saleDate || "").localeCompare(a.saleDate || "")
            ),
            cashFlow: [...addedCashFlow, ...db.cashFlow].sort((a, b) =>
              (b.entryDate || "").localeCompare(a.entryDate || "")
            ),
            documents: newDocs,
          },
          `eBay CSV Sync (${rows.length} items)`
        );
        setEbayModalMode(null);
      }

      // INLINE STOCK QUANTITY & BUY-IN COST LIVE EDITOR
      function handleInlineStockUpdate(itemId, field, rawValue) {
        const updatedInventory = db.inventory.map((item) => {
          if (item.id !== itemId) return item;
          if (field === "quantity") {
            return { ...item, quantity: Math.max(1, Number(rawValue || 1)) };
          }
          if (field === "listedPrice" || field === "acquisitionCost" || field === "minimumReserve") {
            const next = { ...item, [field]: Number(rawValue || 0) };
            if (field === "listedPrice") {
              next.lastPriceCheckDate = new Date().toISOString().split("T")[0];
            }
            return next;
          }
          return { ...item, [field]: rawValue };
        });
        commitDb({ ...db, inventory: updatedInventory }, `Updated Stock ${field}`);
      }

      // 30-DAY RECURRING REPRICING TIMER RESET & OPTIONAL PRICE REDUCTION
      function handleTickOff30DayReprice(itemId, newReducedPrice = null) {
        const today = new Date().toISOString().split("T")[0];
        const updatedInventory = db.inventory.map((item) => {
          if (item.id !== itemId) return item;
          return {
            ...item,
            listedPrice:
              newReducedPrice !== null && !isNaN(Number(newReducedPrice))
                ? Number(Number(newReducedPrice).toFixed(2))
                : item.listedPrice,
            lastPriceCheckDate: today,
          };
        });
        commitDb(
          { ...db, inventory: updatedInventory },
          "Ticked Off 30-Day Reprice & Restarted Timer"
        );
      }

      // CLAUSE 2: APPLY 15% PRICE REDUCTION AFTER 60 DAYS
      function handleApplyConsignment15PercentDrop(itemId) {
        const today = new Date().toISOString().split("T")[0];
        const updatedInventory = db.inventory.map((item) => {
          if (item.id !== itemId) return item;
          const discounted = Number((Number(item.listedPrice || 0) * 0.85).toFixed(2));
          return {
            ...item,
            listedPrice: discounted,
            lastPriceCheckDate: today,
          };
        });
        commitDb(
          { ...db, inventory: updatedInventory },
          "Applied Clause 2 (-15%) 60-Day Price Reduction"
        );
      }

      // CLAUSE 5: EARLY WITHDRAWAL (£5.00 PER ITEM LABOR FEE BEFORE 90 DAYS)
      function handleEarlyWithdrawalFee(item) {
        const qty = Math.max(1, Number(item.quantity ?? 1));
        const feeTotal = Number((qty * TPCG_BUSINESS_INFO.earlyWithdrawalFeePerItem).toFixed(2));
        if (
          !confirm(
            `Clause 5 Early Withdrawal: Withdraw [${item.sku}] (${qty}x) before 90 days and log £${feeTotal.toFixed(
              2
            )} (£5.00/item) fee as business income?`
          )
        ) {
          return;
        }
        const today = new Date().toISOString().split("T")[0];
        const feeSaleId = "sale-ewf-" + Date.now();
        const feeSaleRecord = {
          id: feeSaleId,
          sku: item.sku,
          title: `Clause 5 Early Withdrawal Fee (${qty}x £5.00): ${item.title}`,
          quantitySold: qty,
          category: item.category || "OTHER",
          condition: item.condition || "Withdrawn",
          remarks: "Clause 5 Early Withdrawal Labor Fee",
          storageLocation: "Returned to Consignor",
          platform: "IN_PERSON_EVENT",
          platformItemId: "CLAUSE-5-FEE",
          acquisitionType: "OWNED_STOCK",
          consigneeId: item.consigneeId,
          listedDate: item.createdAt,
          saleDate: today,
          payoutDueDate: today,
          buyerUsername: "consignor_early_withdrawal",
          grossSalePrice: feeTotal,
          shippingChargedToBuyer: 0,
          platformFeeAmount: 0,
          adFeeAmount: 0,
          actualPostageCost: 0,
          packagingCost: 0,
          ownedStockCogs: 0,
          netProfit: feeTotal,
          businessProfitShare: feeTotal,
          consigneePayoutAmount: 0,
          amountPaidSoFar: 0,
          payoutStatus: "NOT_APPLICABLE",
          payoutId: null,
        };

        commitDb(
          {
            ...db,
            inventory: db.inventory.filter((i) => i.id !== item.id),
            sales: [feeSaleRecord, ...db.sales],
            cashFlow: [
              {
                id: "cf-ewf-" + Date.now(),
                entryDate: today,
                type: "INGOING",
                source: "CLAUSE_5_EARLY_WITHDRAWAL_FEE",
                amount: feeTotal,
                description: `Clause 5 Early Withdrawal Fee (£5/item): [${item.sku}]`,
                saleRecordId: feeSaleId,
              },
              ...db.cashFlow,
            ],
          },
          `Logged £${feeTotal} Early Withdrawal Fee for ${item.sku}`
        );
      }

      // CLAUSE 5: CONVERT ABANDONED GOODS (120+ DAYS) TO 100% BUSINESS OWNED STOCK
      function handleClaimAbandonedGoods(item) {
        if (
          !confirm(
            `Clause 5 Abandoned Goods: Convert [${item.sku}] (listed 120+ days) into 100% Business Owned Stock at £0.00 Buy-In Cost?`
          )
        ) {
          return;
        }
        const today = new Date().toISOString().split("T")[0];
        const newOwnedSku = generateNextCustomSku("OWNED_STOCK", null, db.inventory, db.sales);
        const updatedInventory = db.inventory.map((i) =>
          i.id === item.id
            ? {
                ...i,
                sku: newOwnedSku,
                acquisitionType: "OWNED_STOCK",
                consigneeId: null,
                acquisitionCost: 0,
                lastPriceCheckDate: today,
                remarks: `${i.remarks ? i.remarks + " • " : ""}Converted under Clause 5 Abandoned Goods (was ${item.sku})`,
              }
            : i
        );
        commitDb(
          { ...db, inventory: updatedInventory },
          `Claimed Abandoned Goods ${item.sku} -> ${newOwnedSku}`
        );
      }

      // REACTIVE INLINE SALE EDITOR (UPDATES 60/40 SPLIT, OWED TOTALS, TAX & CASH-FLOW)
      function handleInlineSaleUpdate(saleId, field, rawVal) {
        const updatedSales = db.sales.map((s) => {
          if (s.id !== saleId) return s;
          const isStringField =
            field === "consigneeId" ||
            field === "acquisitionType" ||
            field === "saleDate" ||
            field === "sku";
          const updated = {
            ...s,
            [field]: isStringField ? rawVal : Number(rawVal || 0),
          };

          if (field === "sku") {
            const scan = scanSkuAndMatchConsignee(rawVal, db.consignees);
            if (scan.matched) {
              updated.sku = scan.normalizedSku;
              updated.acquisitionType = scan.acquisitionType;
              updated.consigneeId = scan.consigneeId;
            }
          }
          if (field === "saleDate") {
            updated.payoutDueDate = addDaysToIso(rawVal, 14);
          }
          if (field === "acquisitionType" && rawVal === "OWNED_STOCK") {
            updated.consigneeId = null;
          }

          const consigneeObj = db.consignees.find((c) => c.id === updated.consigneeId);
          const split = calculateSaleSplit({
            acquisitionType: updated.acquisitionType,
            grossSalePrice: updated.grossSalePrice,
            shippingChargedToBuyer: updated.shippingChargedToBuyer,
            platformFeeAmount: updated.platformFeeAmount,
            adFeeAmount: updated.adFeeAmount || 0,
            actualPostageCost: updated.actualPostageCost,
            packagingCost: updated.packagingCost,
            acquisitionCost: updated.ownedStockCogs || 0,
            consigneeSplitPercentage: consigneeObj ? Number(consigneeObj.defaultSplit) : 60,
          });

          const alreadyPaid = Number(updated.amountPaidSoFar || 0);
          let nextStatus = "NOT_APPLICABLE";
          if (updated.payoutStatus === "RETURNED") {
            nextStatus = "RETURNED";
          } else if (updated.acquisitionType === "CONSIGNMENT") {
            if (alreadyPaid >= split.consigneePayoutAmount && split.consigneePayoutAmount > 0) {
              nextStatus = "PAID";
            } else if (alreadyPaid > 0) {
              nextStatus = "PART_PAID";
            } else {
              nextStatus = "UNPAID";
            }
          }

          return {
            ...updated,
            netProfit: split.netProfit,
            businessProfitShare: split.businessProfitShare,
            consigneePayoutAmount: split.consigneePayoutAmount,
            payoutStatus: nextStatus,
          };
        });

        const targetSale = updatedSales.find((s) => s.id === saleId);
        const newGrossIn = targetSale
          ? toGbp(toPence(targetSale.grossSalePrice) + toPence(targetSale.shippingChargedToBuyer))
          : 0;
        const newDirectOut = targetSale
          ? toGbp(
              toPence(targetSale.platformFeeAmount) +
                toPence(targetSale.adFeeAmount || 0) +
                toPence(targetSale.actualPostageCost) +
                toPence(targetSale.packagingCost)
            )
          : 0;

        const updatedCashFlow = db.cashFlow.map((cf) => {
          if (cf.saleRecordId === saleId && cf.source === "SALE_GROSS_RECEIPT") {
            return { ...cf, amount: newGrossIn };
          }
          if (cf.saleRecordId === saleId && cf.source === "PLATFORM_FEE_DEDUCTION") {
            return { ...cf, amount: newDirectOut };
          }
          return cf;
        });

        commitDb(
          { ...db, sales: updatedSales, cashFlow: updatedCashFlow },
          `Updated Sale ${field}`
        );
      }

      // EBAY RETURN, POSTAGE CHARGED & CREDIT RECEIVED HANDLER
      function handleConfirmSaleReturn({
        saleId,
        returnPostageCost,
        returnEbayCredit,
        restockToInventory,
        triggerClause4Clawback,
        returnNotes,
      }) {
        const targetSale = db.sales.find((s) => s.id === saleId);
        if (!targetSale) return;

        const today = new Date().toISOString().split("T")[0];
        const qtyReturned = Math.max(1, Number(targetSale.quantitySold || 1));

        // Net cost left on the sale after eBay refunds buyer & credits fee/postage
        const netLossOrCredit = toGbp(
          toPence(returnEbayCredit || 0) -
            toPence(targetSale.actualPostageCost || 0) -
            toPence(returnPostageCost || 0)
        );

        const updatedSales = db.sales.map((s) => {
          if (s.id !== saleId) return s;
          return {
            ...s,
            returnPostageCost,
            returnEbayCredit,
            returnNotes,
            clawbackRequired: triggerClause4Clawback,
            netProfit: netLossOrCredit,
            businessProfitShare: netLossOrCredit,
            consigneePayoutAmount: 0,
            payoutStatus: "RETURNED",
          };
        });

        let updatedInventory = [...db.inventory];
        if (restockToInventory) {
          const existingIdx = updatedInventory.findIndex(
            (i) => i.sku.toUpperCase() === (targetSale.sku || "").toUpperCase()
          );
          if (existingIdx !== -1) {
            updatedInventory[existingIdx] = {
              ...updatedInventory[existingIdx],
              quantity: Math.max(1, Number(updatedInventory[existingIdx].quantity ?? 1)) + qtyReturned,
            };
          } else {
            const unitCogs =
              qtyReturned > 0 ? Number((Number(targetSale.ownedStockCogs || 0) / qtyReturned).toFixed(2)) : 0;
            const unitPrice =
              qtyReturned > 0 ? Number((Number(targetSale.grossSalePrice || 0) / qtyReturned).toFixed(2)) : 0;
            updatedInventory.unshift({
              id: "inv-returned-" + Date.now(),
              sku: targetSale.sku || "SKU-RETURNED",
              title: targetSale.title,
              quantity: qtyReturned,
              category: targetSale.category || "TRADING_CARDS",
              acquisitionType: targetSale.acquisitionType || "CONSIGNMENT",
              consigneeId: targetSale.consigneeId || null,
              acquisitionCost: unitCogs,
              minimumReserve: 0,
              condition: targetSale.condition || ITEM_CONDITIONS[3],
              remarks: returnNotes ? `Returned: ${returnNotes}` : targetSale.remarks || "",
              storageLocation: targetSale.storageLocation || "Vault A-01",
              listedPrice: unitPrice,
              status: "ACTIVE",
              platform: targetSale.platform || "EBAY",
              platformItemId: targetSale.platformItemId || "N/A",
              createdAt: today,
              lastPriceCheckDate: today,
            });
          }
        }

        // Remove original sale receipt cash-flow and log return postage & credit
        const filteredCf = db.cashFlow.filter((cf) => cf.saleRecordId !== saleId);
        if (returnPostageCost > 0) {
          filteredCf.unshift({
            id: "cf-ret-post-" + Date.now(),
            entryDate: today,
            type: "OUTGOING",
            source: "EBAY_RETURN_POSTAGE",
            amount: returnPostageCost,
            description: `eBay Return Postage Charged: [${targetSale.sku}] ${returnNotes || ""}`,
            saleRecordId: saleId,
          });
        }
        if (returnEbayCredit > 0) {
          filteredCf.unshift({
            id: "cf-ret-cred-" + (Date.now() + 1),
            entryDate: today,
            type: "INGOING",
            source: "EBAY_RETURN_CREDIT",
            amount: returnEbayCredit,
            description: `eBay Return Fee/Postage Credit: [${targetSale.sku}]`,
            saleRecordId: saleId,
          });
        }

        // Log net return postage loss as deductible business overhead if negative
        const newExpenses = [...db.expenses];
        if (netLossOrCredit < 0) {
          newExpenses.unshift({
            id: "exp-ret-" + Date.now(),
            expenseDate: today,
            category: "PACKAGING_SUPPLIES",
            merchant: "eBay UK Returns",
            description: `Net Return Postage Loss on [${targetSale.sku}] (Postage £${returnPostageCost} - Credit £${returnEbayCredit})`,
            amount: Math.abs(netLossOrCredit),
            isTaxDeductible: true,
            allocatedToItemSale: false,
            receiptName: "eBay Return Credit Note",
          });
        }

        commitDb(
          {
            ...db,
            inventory: updatedInventory,
            sales: updatedSales,
            cashFlow: filteredCf,
            expenses: newExpenses,
          },
          `Declared Return for ${targetSale.sku}`
        );
        setReturnModalSale(null);
      }

      // ADD STOCK HANDLER (WITH MULTI-QUANTITY & BUY-IN COST)
      function handleAddStockSave(stockPayload) {
        const today = new Date().toISOString().split("T")[0];
        const qty = Math.max(1, Number(stockPayload.quantity || 1));
        const unitCost =
          stockPayload.acquisitionType === "OWNED_STOCK"
            ? Number(stockPayload.acquisitionCost || 0)
            : 0;

        const newItem = {
          id: "inv-" + Date.now(),
          ...stockPayload,
          quantity: qty,
          acquisitionCost: unitCost,
          status: "ACTIVE",
          createdAt: today,
          lastPriceCheckDate: today,
        };

        const newCashFlow = [...db.cashFlow];
        if (stockPayload.acquisitionType === "OWNED_STOCK" && unitCost > 0) {
          const totalBuyIn = Number((unitCost * qty).toFixed(2));
          newCashFlow.unshift({
            id: "cf-" + Date.now(),
            entryDate: today,
            type: "OUTGOING",
            source: "OWNED_STOCK_ACQUISITION",
            amount: totalBuyIn,
            description: `Buy-In Cost (${qty}x ${fmtGBP(unitCost)}): [${newItem.sku}] ${newItem.title}`,

      // MULTI-QUANTITY MOVE STOCK TO SOLD HANDLER (SELL 1 OF 60 -> 59 REMAIN IN STOCK)
      function handleConfirmRecordSale(saleData) {
        const {
          saleDate,
          payoutDueDate,
          quantitySold,
          unitBuyInCost,
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          adFeeAmount,
          actualPostageCost,
          packagingCost,
          buyerUsername,
          proofFileObj,
        } = saleData;

        const qSold = Math.max(1, Number(quantitySold || 1));
        const currentStockQty = Math.max(1, Number(saleModalItem.quantity ?? 1));
        const remainingStockQty = currentStockQty - qSold;

        const isConsignment = saleModalItem.acquisitionType === "CONSIGNMENT";
        const totalCogsSold = isConsignment
          ? 0
          : Number((Number(unitBuyInCost ?? saleModalItem.acquisitionCost ?? 0) * qSold).toFixed(2));

        const consignee = db.consignees.find((c) => c.id === saleModalItem.consigneeId);
        const split = calculateSaleSplit({
          acquisitionType: saleModalItem.acquisitionType,
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          adFeeAmount: adFeeAmount || 0,
          actualPostageCost,
          packagingCost,
          acquisitionCost: totalCogsSold,
          consigneeSplitPercentage: consignee ? Number(consignee.defaultSplit) : 60,
        });

        const cleanSaleDate = normalizeUkDateToIso(saleDate);
        const cleanDueDate = payoutDueDate || addDaysToIso(cleanSaleDate, 14);
        const saleId = "sale-" + Date.now();
        const proofDocId = proofFileObj ? "doc-proof-" + Date.now() : null;

        const newSale = {
          id: saleId,
          sku: saleModalItem.sku,
          title: saleModalItem.title,
          quantitySold: qSold,
          category: saleModalItem.category,
          condition: saleModalItem.condition,
          remarks: saleModalItem.remarks || "",
          storageLocation: saleModalItem.storageLocation,
          platform: saleModalItem.platform,
          platformItemId: saleModalItem.platformItemId,
          acquisitionType: saleModalItem.acquisitionType,
          consigneeId: saleModalItem.consigneeId,
          listedDate: saleModalItem.createdAt,
          saleDate: cleanSaleDate,
          payoutDueDate: cleanDueDate,
          buyerUsername,
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          adFeeAmount: Number(adFeeAmount || 0),
          actualPostageCost,
          packagingCost,
          ownedStockCogs: totalCogsSold,
          netProfit: split.netProfit,
          businessProfitShare: split.businessProfitShare,
          consigneePayoutAmount: split.consigneePayoutAmount,
          amountPaidSoFar: 0,
          payoutStatus: isConsignment ? "UNPAID" : "NOT_APPLICABLE",
          payoutId: null,
          proofDocId,
        };

        // Keep remaining units in Stock if remainingStockQty > 0!
        const nextInventory =
          remainingStockQty > 0
            ? db.inventory.map((item) =>
                item.id === saleModalItem.id
                  ? {
                      ...item,
                      quantity: remainingStockQty,
                      acquisitionCost: isConsignment ? 0 : Number(unitBuyInCost ?? item.acquisitionCost ?? 0),
                    }
                  : item
              )
            : db.inventory.filter((item) => item.id !== saleModalItem.id);

        const newCashFlow = [
          {
            id: "cf-in-" + Date.now(),
            entryDate: cleanSaleDate,
            type: "INGOING",
            source: "SALE_GROSS_RECEIPT",
            amount: split.totalIngoing,
            description: `Gross Receipt (${qSold}x): [${saleModalItem.sku}] ${saleModalItem.title}`,
            saleRecordId: saleId,
          },
          ...db.cashFlow,
        ];

        const directOutgoings = toGbp(
          toPence(platformFeeAmount) +
            toPence(adFeeAmount || 0) +
            toPence(actualPostageCost) +
            toPence(packagingCost)
        );
        if (directOutgoings > 0) {
          newCashFlow.unshift({
            id: "cf-out-" + (Date.now() + 1),
            entryDate: cleanSaleDate,
            type: "OUTGOING",
            source: "PLATFORM_FEE_DEDUCTION",
            amount: directOutgoings,
            description: `Tx Fee, Ad Fee, Postage & Pack: [${saleModalItem.sku}]`,
            saleRecordId: saleId,
          });
        }

        const newDocs = [...db.documents];
        if (proofFileObj) {
          newDocs.unshift({
            id: proofDocId,
            fileName: proofFileObj.name,
            mimeType: proofFileObj.mimeType,
            dataUrl: proofFileObj.dataUrl,
            documentType: "PROOF_OF_POSTAGE",
            consigneeId: saleModalItem.consigneeId || null,
            linkedTo: `Sale: ${saleModalItem.sku} (${fmtGBP(actualPostageCost)})`,
            fileSize: proofFileObj.sizeKb || "320 KB",
            uploadedAt: cleanSaleDate,
          });
        }

        commitDb(
          {
            ...db,
            inventory: nextInventory,
            sales: [newSale, ...db.sales].sort((a, b) =>
              (b.saleDate || "").localeCompare(a.saleDate || "")
            ),
            cashFlow: newCashFlow.sort((a, b) =>
              (b.entryDate || "").localeCompare(a.entryDate || "")
            ),
            documents: newDocs,
          },
          `Sold ${qSold}x ${saleModalItem.sku}`
        );
        setSaleModalItem(null);
      }

      // MULTI-QUANTITY VOID SALE (ADDS SOLD QUANTITY BACK TO ACTIVE STOCK)
      function handleVoidSale(saleId) {
        const targetSale = db.sales.find((s) => s.id === saleId);
        if (!targetSale) return;
        if (targetSale.payoutStatus === "PAID" || Number(targetSale.amountPaidSoFar || 0) > 0) {
          alert(
            "This sale has a payout recorded against it. Use the Return button or delete the Payout record first."
          );
          return;
        }
        const qToRestore = Math.max(1, Number(targetSale.quantitySold ?? 1));
        if (
          !confirm(
            `Void sale and return ${qToRestore} unit(s) of [${targetSale.sku}] back to Active Stock?`
          )
        ) {
          return;
        }

        const existingStockIdx = db.inventory.findIndex(
          (i) => i.sku.toUpperCase() === (targetSale.sku || "").toUpperCase()
        );
        let nextInventory = [...db.inventory];

        if (existingStockIdx !== -1) {
          nextInventory[existingStockIdx] = {
            ...nextInventory[existingStockIdx],
            quantity:
              Math.max(1, Number(nextInventory[existingStockIdx].quantity ?? 1)) + qToRestore,
          };
        } else {
          const unitCogs =
            qToRestore > 0
              ? Number((Number(targetSale.ownedStockCogs || 0) / qToRestore).toFixed(2))
              : 0;
          const unitPrice =
            qToRestore > 0
              ? Number((Number(targetSale.grossSalePrice || 0) / qToRestore).toFixed(2))
              : 0;
          nextInventory.unshift({
            id: "inv-restored-" + Date.now(),
            sku: targetSale.sku || "SKU-RESTORED",
            title: targetSale.title || "Restored Item",
            quantity: qToRestore,
            category: targetSale.category || "TRADING_CARDS",
            acquisitionType: targetSale.acquisitionType || "CONSIGNMENT",
            consigneeId: targetSale.consigneeId || null,
            acquisitionCost: unitCogs,
            minimumReserve: 0,
            condition: targetSale.condition || ITEM_CONDITIONS[1],
            remarks: targetSale.remarks || "",
            storageLocation: targetSale.storageLocation || "Vault A-01",
            listedPrice: unitPrice,
            status: "ACTIVE",
            platform: targetSale.platform || "EBAY",
            platformItemId: targetSale.platformItemId || "N/A",
            createdAt: targetSale.listedDate || new Date().toISOString().split("T")[0],
            lastPriceCheckDate: new Date().toISOString().split("T")[0],
          });
        }

        commitDb(
          {
            ...db,
            sales: db.sales.filter((s) => s.id !== saleId),
            inventory: nextInventory,
            cashFlow: db.cashFlow.filter((cf) => cf.saleRecordId !== saleId),
          },
          `Voided Sale ${targetSale.sku} (+${qToRestore} to Stock)`
        );
      }

      // PART-SETTLEMENT & FORTNIGHTLY PAYOUT HANDLER
      function handleConfirmPartSettlement({
        consigneeId,
        selectedSaleIds,
        amountToPay,
        paymentReference,
      }) {
        const consignee = db.consignees.find((c) => c.id === consigneeId);
        if (!consignee) return;

        let remainingBudgetPence = toPence(amountToPay);
        const selectedSet = new Set(selectedSaleIds);
        const allocationsBySaleId = {};
        const lineItems = [];
        const payoutId = "po-" + Date.now();
        const today = new Date().toISOString().split("T")[0];
        const payoutNumber = `PO-2026-${String(db.payouts.length + 101).padStart(4, "0")}`;

        const updatedSales = db.sales.map((s) => {
          if (!selectedSet.has(s.id) || remainingBudgetPence <= 0) return s;

          const total60Pence = toPence(s.consigneePayoutAmount);
          const paidSoFarPence = toPence(s.amountPaidSoFar || 0);
          const neededPence = Math.max(0, total60Pence - paidSoFarPence);
          if (neededPence === 0) return s;

          const allocatedPence = Math.min(neededPence, remainingBudgetPence);
          remainingBudgetPence -= allocatedPence;

          const newPaidSoFarPence = paidSoFarPence + allocatedPence;
          const isFullyPaid = newPaidSoFarPence >= total60Pence;

          allocationsBySaleId[s.id] = toGbp(allocatedPence);

          lineItems.push({
            sku: s.sku || "SKU",
            title: s.title || "Item",
            quantitySold: s.quantitySold || 1,
            saleDate: s.saleDate,
            payoutDueDate: s.payoutDueDate || addDaysToIso(s.saleDate, 14),
            grossPlusShipping: toGbp(toPence(s.grossSalePrice) + toPence(s.shippingChargedToBuyer)),
            deductions: toGbp(
              toPence(s.platformFeeAmount) +
                toPence(s.adFeeAmount || 0) +
                toPence(s.actualPostageCost) +
                toPence(s.packagingCost)
            ),
            netProfit: s.netProfit,
            consigneeShare60: s.consigneePayoutAmount,
            paidThisBatch: toGbp(allocatedPence),
            remainingBalance: toGbp(Math.max(0, total60Pence - newPaidSoFarPence)),
          });

          return {
            ...s,
            amountPaidSoFar: toGbp(newPaidSoFarPence),
            payoutStatus: isFullyPaid ? "PAID" : "PART_PAID",
            payoutId: isFullyPaid ? payoutId : s.payoutId,
          };
        });

        const actualTotalPaid = toGbp(toPence(amountToPay) - remainingBudgetPence);

        const newPayout = {
          id: payoutId,
          payoutNumber,
          consigneeId,
          consigneeName: consignee.name,
          consigneeEmail: consignee.email,
          consigneeBank: consignee.bankDetails,
          totalPayoutAmount: actualTotalPaid,
          paidAt: today,
          paymentReference,
          allocationsBySaleId,
          items: lineItems,
        };

        commitDb(
          {
            ...db,
            sales: updatedSales,
            payouts: [newPayout, ...db.payouts],
            cashFlow: [
              {
                id: "cf-po-" + Date.now(),
                entryDate: today,
                type: "OUTGOING",
                source: "CONSIGNEE_PAYOUT",
                amount: actualTotalPaid,
                description: `Consignee 60% Payout ${payoutNumber} to ${consignee.name} (${paymentReference})`,
                payoutId,
              },
              ...db.cashFlow,
            ],
            documents: [
              {
                id: "doc-po-" + Date.now(),
                fileName: `${payoutNumber}-${consignee.name.toLowerCase().replace(/\s+/g, "-")}.pdf`,
                documentType: "PAYOUT_STATEMENT_PDF",
                consigneeId,
                linkedTo: `Payout: ${payoutNumber} (${fmtGBP(actualTotalPaid)})`,
                fileSize: "164 KB",
                uploadedAt: today,
              },
              ...db.documents,
            ],
          },
          `Settled Payout ${payoutNumber} (${fmtGBP(actualTotalPaid)})`
        );

        setSettleModalConsignee(null);
        setStatementModalPayout(newPayout);
      }

      // ADD CONSIGNEE (WITH AUTO 3-LETTER SKU PREFIX & SEPARATE SORT CODE / ACCOUNT NO)
      async function handleAddConsignee(e) {
        e.preventDefault();
        const form = e.target;
        const fd = new FormData(form);
        const agreementFile = form.agreementFile?.files?.[0] || null;

        const name = fd.get("name").trim();
        const customPrefix = fd.get("skuPrefix")?.trim().toUpperCase();
        const skuPrefix =
          customPrefix && customPrefix.length === 3
            ? customPrefix
            : getConsigneeSkuPrefix(name);
        const email = fd.get("email").trim();
        const phone = fd.get("phone")?.trim() || "";
        const address = fd.get("address")?.trim() || "";
        const sortCode = formatUkSortCode(consigneeSortCode || fd.get("sortCode"));
        const accountNumber = String(consigneeAccountNum || fd.get("accountNumber") || "")
          .replace(/\D/g, "")
          .slice(0, 8);
        const bankName = fd.get("bankName")?.trim() || "";
        const paypalEmail = fd.get("paypalEmail")?.trim() || "";
        const defaultSplit = Number(fd.get("defaultSplit") || 60);
        const notes = fd.get("notes")?.trim() || "";

        const formattedBank = `Sort: ${sortCode} | Acc: ${accountNumber}${bankName ? ` (${bankName})` : ""}`;
        const today = new Date().toISOString().split("T")[0];
        const fileDataObj = await readFileAsDataUrl(agreementFile);
        const consigneeId = "con-" + Date.now();
        const contractDocId = fileDataObj ? "doc-con-" + Date.now() : null;

        const newConsignee = {
          id: consigneeId,
          skuPrefix,
          name,
          email,
          phone,
          address,
          sortCode,
          accountNumber,
          bankName,
          paypalEmail,
          bankDetails: formattedBank,
          defaultSplit,
          notes,
          contractDocId,
          createdAt: today,
        };

        const newDocs = [...db.documents];
        if (fileDataObj) {
          newDocs.unshift({
            id: contractDocId,
            fileName: fileDataObj.name,
            mimeType: fileDataObj.mimeType,
            dataUrl: fileDataObj.dataUrl,
            documentType: "CONSIGNMENT_AGREEMENT",

            linkedTo: `Consignee: ${newConsignee.name} (CON-${skuPrefix})`,
            fileSize: fileDataObj.sizeKb,
            uploadedAt: today,
          });

        commitDb(
          { ...db, consignees: [newConsignee, ...db.consignees], documents: newDocs },
          `Added Consignee ${newConsignee.name} (CON-${skuPrefix})`
        );
        setConsigneeSortCode("");
        setConsigneeAccountNum("");
        setShowAddConsigneeModal(false);
      }
