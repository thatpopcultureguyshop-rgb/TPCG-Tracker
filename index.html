<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 1. SECURITY & STORAGE CONFIGURATION
    // ==========================================
    const MASTER_PIN = "2026";
    const PIN_STORAGE_KEY = "tpcg_custom_pin_v1";
    const SESSION_UNLOCK_KEY = "tpcg_session_unlocked_v1";
    const STORAGE_KEY = "tpcg_platform_state_v4";

    const toPence = (gbp) => Math.round((Number(gbp) || 0) * 100);
    const toGbp = (pence) => Number((pence / 100).toFixed(2));
    const fmtGBP = (val) =>
      new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(Number(val) || 0);

    function normalizeUkDateToIso(rawDate) {
      if (!rawDate) return new Date().toISOString().split("T")[0];
      const str = String(rawDate).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);

      const ukSlash = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (ukSlash) {
        const day = String(ukSlash[1]).padStart(2, "0");
        const month = String(ukSlash[2]).padStart(2, "0");
        let year = String(ukSlash[3]);
        if (year.length === 2) year = "20" + year;
        return `${year}-${month}-${day}`;
      }

      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        return parsed.toISOString().split("T")[0];
      }
      return new Date().toISOString().split("T")[0];
    }

    const UK_PLATFORM_PRESETS = {
      EBAY: {
        label: "eBay UK Business (12.8% + £0.30)",
        shortName: "eBay UK (Biz)",
        calc: (gross, ship) => {
          const total = (Number(gross) || 0) + (Number(ship) || 0);
          return total > 0 ? Number((total * 0.128 + 0.3).toFixed(2)) : 0;
        },
      },
      EBAY_PRIVATE: {
        label: "eBay UK Private Seller (0% Fee)",
        shortName: "eBay UK (Private)",
        calc: () => 0,
      },
      WHATNOT: {
        label: "Whatnot UK (8% Gross + 2.9% + £0.30 Total)",
        shortName: "Whatnot UK",
        calc: (gross, ship) => {
          const g = Number(gross) || 0;
          const total = g + (Number(ship) || 0);
          return total > 0 ? Number((g * 0.08 + total * 0.029 + 0.3).toFixed(2)) : 0;
        },
      },
      CARDMARKET: {
        label: "Cardmarket UK (5.0% Trustee Fee)",
        shortName: "Cardmarket",
        calc: (gross, ship) => {
          const total = (Number(gross) || 0) + (Number(ship) || 0);
          return Number((total * 0.05).toFixed(2));
        },
      },
      SHOPIFY: {
        label: "Shopify UK Payments (2.0% + £0.25)",
        shortName: "Shopify UK",
        calc: (gross, ship) => {
          const total = (Number(gross) || 0) + (Number(ship) || 0);
          return total > 0 ? Number((total * 0.02 + 0.25).toFixed(2)) : 0;
        },
      },
      VINTED: {
        label: "Vinted UK (0% Seller Fee)",
        shortName: "Vinted UK",
        calc: () => 0,
      },
      IN_PERSON_EVENT: {
        label: "In-Person Card Show / Cash (0% Fee)",
        shortName: "In-Person Event",
        calc: () => 0,
      },
      CUSTOM: {
        label: "Custom / Manual Fee Entry",
        shortName: "Custom",
        calc: null,
      },
    };

    function calculatePlatformFeeByPreset(presetKey, gross, shipping) {
      const preset = UK_PLATFORM_PRESETS[presetKey] || UK_PLATFORM_PRESETS.EBAY;
      return preset.calc ? preset.calc(gross, shipping) : 0;
    }

    function calculateSaleSplit({
      acquisitionType,
      grossSalePrice,
      shippingChargedToBuyer,
      platformFeeAmount,
      actualPostageCost,
      packagingCost,
      acquisitionCost = 0,
      consigneeSplitPercentage = 60,
    }) {
      const grossP = toPence(grossSalePrice);
      const shipInP = toPence(shippingChargedToBuyer);
      const feeP = toPence(platformFeeAmount);
      const postOutP = toPence(actualPostageCost);
      const packP = toPence(packagingCost);
      const cogsP = acquisitionType === "OWNED_STOCK" ? toPence(acquisitionCost) : 0;

      const totalIngoingP = grossP + shipInP;
      const totalDirectCostsP = feeP + postOutP + packP + cogsP;
      const netProfitP = totalIngoingP - totalDirectCostsP;

      if (acquisitionType === "OWNED_STOCK") {
        return {
          totalIngoing: toGbp(totalIngoingP),
          totalDirectCosts: toGbp(totalDirectCostsP),
          netProfit: toGbp(netProfitP),
          businessProfitShare: toGbp(netProfitP),
          consigneePayoutAmount: 0,
        };
      }

      if (netProfitP <= 0) {
        return {
          totalIngoing: toGbp(totalIngoingP),
          totalDirectCosts: toGbp(totalDirectCostsP),
          netProfit: toGbp(netProfitP),
          businessProfitShare: toGbp(netProfitP),
          consigneePayoutAmount: 0,
        };
      }

      const consigneeP = Math.round((netProfitP * consigneeSplitPercentage) / 100);
      const businessP = netProfitP - consigneeP;

      return {
        totalIngoing: toGbp(totalIngoingP),
        totalDirectCosts: toGbp(totalDirectCostsP),
        netProfit: toGbp(netProfitP),
        businessProfitShare: toGbp(businessP),
        consigneePayoutAmount: toGbp(consigneeP),
      };
    }

    function calculateUkTaxLiability(totalBusinessSaleProfit, deductibleOverheadExpenses, entityStructure = "SOLE_TRADER") {
      const taxableNetProfit = Math.max(0, totalBusinessSaleProfit - deductibleOverheadExpenses);
      if (taxableNetProfit === 0) {
        return {
          entityStructure,
          totalBusinessSaleProfit,
          deductibleOverheadExpenses,
          taxableNetProfit: 0,
          incomeOrCorpTax: 0,
          class4NationalInsurance: 0,
          totalEstimatedTaxLiability: 0,
          effectiveTaxRatePercent: 0,
          netProfitAfterTax: 0,
        };
      }

      if (entityStructure === "LIMITED_COMPANY") {
        let corpTax = 0;
        if (taxableNetProfit <= 50000) {
          corpTax = taxableNetProfit * 0.19;
        } else if (taxableNetProfit >= 250000) {
          corpTax = taxableNetProfit * 0.25;
        } else {
          const mainRateTax = taxableNetProfit * 0.25;
          const marginalRelief = (250000 - taxableNetProfit) * (3 / 200);
          corpTax = mainRateTax - marginalRelief;
        }
        const roundedCorp = Number(corpTax.toFixed(2));
        return {
          entityStructure,
          totalBusinessSaleProfit,
          deductibleOverheadExpenses,
          taxableNetProfit: Number(taxableNetProfit.toFixed(2)),
          incomeOrCorpTax: roundedCorp,
          class4NationalInsurance: 0,
          totalEstimatedTaxLiability: roundedCorp,
          effectiveTaxRatePercent: Number(((roundedCorp / taxableNetProfit) * 100).toFixed(2)),
          netProfitAfterTax: Number((taxableNetProfit - roundedCorp).toFixed(2)),
        };
      }

      let personalAllowance = 12570;
      if (taxableNetProfit > 100000) {
        personalAllowance = Math.max(0, 12570 - (taxableNetProfit - 100000) / 2);
      }
      const taxableAfterAllowance = Math.max(0, taxableNetProfit - personalAllowance);
      const basicBandLimit = 37700;
      const higherThreshold = 125140;

      let incomeTax = 0;
      if (taxableAfterAllowance > 0) {
        const basicPortion = Math.min(taxableAfterAllowance, basicBandLimit);
        incomeTax += basicPortion * 0.2;

        if (taxableAfterAllowance > basicBandLimit) {
          const higherBandMax = higherThreshold - personalAllowance - basicBandLimit;
          const higherPortion = Math.min(taxableAfterAllowance - basicBandLimit, Math.max(0, higherBandMax));
          incomeTax += higherPortion * 0.4;
        }
        if (taxableNetProfit > higherThreshold) {
          incomeTax += (taxableNetProfit - higherThreshold) * 0.45;
        }
      }

      let class4Nic = 0;
      if (taxableNetProfit > 12570) {
        const mainNicBand = Math.min(taxableNetProfit, 50270) - 12570;
        class4Nic += mainNicBand * 0.06;
        if (taxableNetProfit > 50270) {
          class4Nic += (taxableNetProfit - 50270) * 0.02;
        }
      }

      const rIncome = Number(incomeTax.toFixed(2));
      const rNic = Number(class4Nic.toFixed(2));
      const totalTax = Number((rIncome + rNic).toFixed(2));

      return {
        entityStructure,
        totalBusinessSaleProfit,
        deductibleOverheadExpenses,
        taxableNetProfit: Number(taxableNetProfit.toFixed(2)),
        incomeOrCorpTax: rIncome,
        class4NationalInsurance: rNic,
        totalEstimatedTaxLiability: totalTax,
        effectiveTaxRatePercent: Number(((totalTax / taxableNetProfit) * 100).toFixed(2)),
        netProfitAfterTax: Number((taxableNetProfit - totalTax).toFixed(2)),
      };
    }
    // ==========================================
    // 2. EBAY UK CSV PARSER & AUTO-MAPPER ENGINE
    // ==========================================
    function parseCsvLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function cleanCurrency(val) {
      if (!val) return 0;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : Math.abs(num);
    }

    function guessCategoryFromTitle(title) {
      const t = (title || "").toLowerCase();
      if (t.includes("pokemon") || t.includes("pokémon") || t.includes("psa") || t.includes("charizard") || t.includes("tcg") || t.includes("magic") || t.includes("umbreon") || t.includes("rayquaza")) return "TRADING_CARDS";
      if (t.includes("lego") || t.includes("minifig") || t.includes("ucs")) return "LEGO";
      if (t.includes("funko") || t.includes("pop!")) return "FUNKO_POP";
      if (t.includes("hot toys") || t.includes("hasbro") || t.includes("figure") || t.includes("sideshow") || t.includes("neca")) return "ACTION_FIGURES";
      if (t.includes("cgc") || t.includes("comic") || t.includes("marvel") || t.includes("asm")) return "COMICS";
      if (t.includes("gameboy") || t.includes("nintendo") || t.includes("playstation") || t.includes("sega") || t.includes("zelda")) return "VIDEO_GAMES";
      return "TRADING_CARDS";
    }

    function parseEbayCsvReport(csvText, defaultAcquisitionType = "CONSIGNMENT", defaultConsigneeId = "con-1") {
      const rawLines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      let headerIdx = 0;
      for (let i = 0; i < Math.min(rawLines.length, 15); i++) {
        const lower = rawLines[i].toLowerCase();
        if (
          lower.includes("item number") ||
          lower.includes("item title") ||
          lower.includes("title") ||
          lower.includes("custom label") ||
          lower.includes("order number")
        ) {
          headerIdx = i;
          break;
        }
      }

      if (rawLines.length <= headerIdx + 1) return { mode: "STOCK", rows: [] };

      const headers = parseCsvLine(rawLines[headerIdx]).map((h) => h.toLowerCase());
      const findCol = (keywords) =>
        headers.findIndex((h) => keywords.some((kw) => h.includes(kw)));

      const colItemId = findCol(["item number", "item id"]);
      const colTitle = findCol(["item title", "title", "product"]);
      const colSku = findCol(["custom label", "sku"]);
      const colStartPrice = findCol(["start price", "buy it now price", "listed price", "price"]);
      const colSoldFor = findCol(["sold for", "sale price", "gross"]);
      const colShipping = findCol(["postage and packaging", "shipping", "delivery"]);
      const colFvfFixed = findCol(["final value fee - fixed", "fixed fee"]);
      const colFvfVar = findCol(["final value fee - variable", "platform fee", "fee"]);
      const colCondition = findCol(["condition"]);
      const colBuyer = findCol(["buyer username", "buyer name", "buyer"]);
      const colSaleDate = findCol(["sale date", "order date", "date"]);
      const colOrderNum = findCol(["order number"]);

      const isSalesReport = colOrderNum !== -1 || colSoldFor !== -1 || colSaleDate !== -1;
      const rows = [];

      for (let i = headerIdx + 1; i < rawLines.length; i++) {
        const cols = parseCsvLine(rawLines[i]);
        if (cols.length < 2) continue;

        const title = (colTitle !== -1 ? cols[colTitle] : "") || "";
        if (!title || title.toLowerCase().includes("total")) continue;

        const itemId = (colItemId !== -1 ? cols[colItemId] : "") || `EB-${Date.now()}-${i}`;
        const rawSku = (colSku !== -1 ? cols[colSku] : "") || `EBAY-${String(itemId).slice(-5)}`;
        const sku = rawSku.toUpperCase();
        const isOwnedBySku = sku.startsWith("OWN-");
        const acqType = isOwnedBySku ? "OWNED_STOCK" : defaultAcquisitionType;

        const price = cleanCurrency(
          colSoldFor !== -1 ? cols[colSoldFor] : colStartPrice !== -1 ? cols[colStartPrice] : 0
        );
        const shippingCharged = cleanCurrency(colShipping !== -1 ? cols[colShipping] : 0);

        let fee = 0;
        if (colFvfFixed !== -1 || colFvfVar !== -1) {
          fee =
            cleanCurrency(colFvfFixed !== -1 ? cols[colFvfFixed] : 0) +
            cleanCurrency(colFvfVar !== -1 ? cols[colFvfVar] : 0);
        } else if (isSalesReport && price > 0) {
          fee = calculatePlatformFeeByPreset("EBAY", price, shippingCharged);
        }

        const rawDateStr = colSaleDate !== -1 ? cols[colSaleDate] : "";

        rows.push({
          tempId: `row-${i}-${Date.now()}`,
          mode: isSalesReport ? "SALE" : "STOCK",
          sku,
          title,
          platformItemId: itemId,
          category: guessCategoryFromTitle(title),
          condition: (colCondition !== -1 ? cols[colCondition] : "") || "Collector Grade",
          acquisitionType: acqType,
          consigneeId: acqType === "CONSIGNMENT" ? defaultConsigneeId : null,
          acquisitionCost: 0,
          listedPrice: price || 29.99,
          grossSalePrice: price || 29.99,
          shippingChargedToBuyer: shippingCharged,
          platformFeeAmount: Number(fee.toFixed(2)),
          actualPostageCost: shippingCharged > 0 ? Number(Math.max(0, shippingCharged - 0.5).toFixed(2)) : 4.45,
          packagingCost: 1.25,
          buyerUsername: (colBuyer !== -1 ? cols[colBuyer] : "") || "ebay_uk_buyer",
          saleDate: normalizeUkDateToIso(rawDateStr),
        });
      }

      return { mode: isSalesReport ? "SALE" : "STOCK", rows };
    }

    // ==========================================
    // 3. DEEP-DIVE BUSINESS INTELLIGENCE ENGINE
    // ==========================================
    function calculateDeepAnalytics(db) {
      const totalItems = db.inventory.length;
      const activeItems = db.inventory.filter((i) => i.status === "ACTIVE");
      const soldItems = db.inventory.filter((i) => i.status !== "ACTIVE");

      const activeConsigned = activeItems.filter((i) => i.acquisitionType === "CONSIGNMENT");
      const activeOwned = activeItems.filter((i) => i.acquisitionType === "OWNED_STOCK");

      const activePortfolioValue = activeItems.reduce((a, i) => a + Number(i.listedPrice), 0);
      const activeConsignedValue = activeConsigned.reduce((a, i) => a + Number(i.listedPrice), 0);
      const activeOwnedRetailValue = activeOwned.reduce((a, i) => a + Number(i.listedPrice), 0);
      const tiedUpOwnedCogs = activeOwned.reduce((a, i) => a + Number(i.acquisitionCost), 0);

      let projectedActiveBusinessProfit = 0;
      activeItems.forEach((item) => {
        const consignee = db.consignees.find((c) => c.id === item.consigneeId);
        const estFee = calculatePlatformFeeByPreset(item.platform || "EBAY", item.listedPrice, 0);
        const estSplit = calculateSaleSplit({
          acquisitionType: item.acquisitionType,
          grossSalePrice: item.listedPrice,
          shippingChargedToBuyer: 0,
          platformFeeAmount: estFee,
          actualPostageCost: 0,
          packagingCost: 1.25,
          acquisitionCost: item.acquisitionCost,
          consigneeSplitPercentage: consignee ? Number(consignee.defaultSplit) : 60,
        });
        projectedActiveBusinessProfit += estSplit.businessProfitShare;
      });

      const sellThroughRate = totalItems > 0 ? Number(((soldItems.length / totalItems) * 100).toFixed(1)) : 0;

      let totalGrossSales = 0;
      let totalShippingCharged = 0;
      let totalPlatformFees = 0;
      let totalActualPostage = 0;
      let totalPackaging = 0;
      let totalSoldOwnedCogs = 0;
      let totalNetProfit = 0;
      let totalBusinessKeep = 0;
      let totalConsigneeShare = 0;
      let consignmentSaleProfitTotal = 0;
      let ownedSaleProfitTotal = 0;
      let totalDaysToSell = 0;
      let soldWithDatesCount = 0;

      const categoryStats = {};
      const channelStats = {};

      db.sales.forEach((s) => {
        const item = db.inventory.find((i) => i.id === s.inventoryItemId);
        const g = Number(s.grossSalePrice);
        const shipIn = Number(s.shippingChargedToBuyer);
        const fee = Number(s.platformFeeAmount);
        const postOut = Number(s.actualPostageCost);
        const packOut = Number(s.packagingCost);
        const cogs = Number(s.ownedStockCogs);
        const net = Number(s.netProfit);
        const biz = Number(s.businessProfitShare);
        const con = Number(s.consigneePayoutAmount);

        totalGrossSales += g;
        totalShippingCharged += shipIn;
        totalPlatformFees += fee;
        totalActualPostage += postOut;
        totalPackaging += packOut;
        totalSoldOwnedCogs += cogs;
        totalNetProfit += net;
        totalBusinessKeep += biz;
        totalConsigneeShare += con;

        if (item?.acquisitionType === "CONSIGNMENT") {
          consignmentSaleProfitTotal += biz;
        } else {
          ownedSaleProfitTotal += biz;
        }

        if (item?.createdAt && s.saleDate) {
          const d1 = new Date(normalizeUkDateToIso(item.createdAt));
          const d2 = new Date(normalizeUkDateToIso(s.saleDate));
          const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)));
          if (!isNaN(diffDays)) {
            totalDaysToSell += diffDays;
            soldWithDatesCount++;
          }
        }

        const cat = item?.category || "OTHER";
        if (!categoryStats[cat]) {
          categoryStats[cat] = { category: cat, soldCount: 0, activeCount: 0, gross: 0, netProfit: 0, businessKeep: 0 };
        }
        categoryStats[cat].soldCount += 1;
        categoryStats[cat].gross += g;
        categoryStats[cat].netProfit += net;
        categoryStats[cat].businessKeep += biz;

        const plat = item?.platform || "EBAY";
        if (!channelStats[plat]) {
          channelStats[plat] = { platform: plat, count: 0, gross: 0, fees: 0, businessKeep: 0 };
        }
        channelStats[plat].count += 1;
        channelStats[plat].gross += g + shipIn;
        channelStats[plat].fees += fee;
        channelStats[plat].businessKeep += biz;
      });

      activeItems.forEach((i) => {
        const cat = i.category || "OTHER";
        if (!categoryStats[cat]) {
          categoryStats[cat] = { category: cat, soldCount: 0, activeCount: 0, gross: 0, netProfit: 0, businessKeep: 0 };
        }
        categoryStats[cat].activeCount += 1;
      });

      const totalTopLineIngoing = totalGrossSales + totalShippingCharged;
      const feeBleedRatePercent =
        totalTopLineIngoing > 0 ? Number(((totalPlatformFees / totalTopLineIngoing) * 100).toFixed(2)) : 0;
      const shippingRecoveryBalance = toGbp(
        (totalShippingCharged - (totalActualPostage + totalPackaging)) * 100
      );
      const ownedStockRoiPercent =
        totalSoldOwnedCogs > 0 ? Number(((ownedSaleProfitTotal / totalSoldOwnedCogs) * 100).toFixed(1)) : 0;
      const businessKeepRatePercent =
        totalTopLineIngoing > 0 ? Number(((totalBusinessKeep / totalTopLineIngoing) * 100).toFixed(1)) : 0;
      const avgDaysToSell =
        soldWithDatesCount > 0 ? Number((totalDaysToSell / soldWithDatesCount).toFixed(1)) : 6.5;

      const postageAndPackTotal = totalActualPostage + totalPackaging;
      const waterfall = {
        feesPct: totalTopLineIngoing > 0 ? Number(((totalPlatformFees / totalTopLineIngoing) * 100).toFixed(1)) : 0,
        postagePackPct: totalTopLineIngoing > 0 ? Number(((postageAndPackTotal / totalTopLineIngoing) * 100).toFixed(1)) : 0,
        cogsPct: totalTopLineIngoing > 0 ? Number(((totalSoldOwnedCogs / totalTopLineIngoing) * 100).toFixed(1)) : 0,
        consigneePct: totalTopLineIngoing > 0 ? Number(((totalConsigneeShare / totalTopLineIngoing) * 100).toFixed(1)) : 0,
        businessKeepPct: totalTopLineIngoing > 0 ? Number(((totalBusinessKeep / totalTopLineIngoing) * 100).toFixed(1)) : 0,
      };

      const now = new Date();
      const agingInventory = activeItems
        .map((item) => {
          const listedDate = new Date(normalizeUkDateToIso(item.createdAt || "2026-10-01"));
          const daysListed = Math.max(1, Math.round((now - listedDate) / (1000 * 60 * 60 * 24)));
          return { ...item, daysListed };
        })
        .sort((a, b) => b.daysListed - a.daysListed);

      const consigneeLeaderboard = db.consignees
        .map((c) => {
          const cItems = db.inventory.filter((i) => i.consigneeId === c.id);
          const cSales = db.sales.filter((s) => {
            const it = db.inventory.find((i) => i.id === s.inventoryItemId);
            return it?.consigneeId === c.id;
          });
          const grossGenerated = cSales.reduce((a, s) => a + Number(s.grossSalePrice), 0);
          const business40Earned = cSales.reduce((a, s) => a + Number(s.businessProfitShare), 0);
          const consignee60Earned = cSales.reduce((a, s) => a + Number(s.consigneePayoutAmount), 0);
          return {
            id: c.id,
            name: c.name,
            totalItems: cItems.length,
            soldCount: cSales.length,
            grossGenerated: toGbp(grossGenerated * 100),
            business40Earned: toGbp(business40Earned * 100),
            consignee60Earned: toGbp(consignee60Earned * 100),
          };
        })

    function SvgBarcode({ value }) {
      const bars = useMemo(() => {
        const str = `*${(value || "SKU").toUpperCase()}*`;
        const pattern = [];
        for (let i = 0; i < str.length; i++) {
          const code = str.charCodeAt(i);
          pattern.push((code % 3) + 1);
          pattern.push(((code >> 2) % 2) + 1);
          pattern.push(((code >> 4) % 3) + 1);
          pattern.push(1);
        }
        return pattern;
      }, [value]);

      let currentX = 0;
      const rects = [];
      bars.forEach((width, idx) => {
        if (idx % 2 === 0) {
          rects.push({ x: currentX, width: width * 1.8 });
        }
        currentX += width * 1.8;
      });

      return (
        <svg
          viewBox={`0 0 ${Math.max(currentX, 100)} 36`}
          className="w-full h-9"
          preserveAspectRatio="none"
        >
          {rects.map((r, i) => (
            <rect key={i} x={r.x} y="0" width={r.width} height="36" fill="currentColor" />
          ))}
        </svg>
      );
    }

    function PinLockScreen({ activePin, onUnlock }) {
      const [enteredPin, setEnteredPin] = useState("");
      const [errorShake, setErrorShake] = useState(false);

      const verifyAttempt = (candidate) => {
        if (candidate === activePin) {
          onUnlock();
        } else {
          setErrorShake(true);
          setTimeout(() => {
            setEnteredPin("");
            setErrorShake(false);
          }, 400);
        }
      };

      const handleDigitPress = (digit) => {
        if (enteredPin.length >= activePin.length) return;
        const nextPin = enteredPin + digit;
        setEnteredPin(nextPin);
        if (nextPin.length === activePin.length) {
          setTimeout(() => verifyAttempt(nextPin), 120);
        }
      };

      const handleBackspace = () => {
        setEnteredPin((prev) => prev.slice(0, -1));
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key >= "0" && e.key <= "9") {
            handleDigitPress(e.key);
          } else if (e.key === "Backspace") {
            handleBackspace();
          } else if (e.key === "Escape") {
            setEnteredPin("");
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [enteredPin, activePin]);

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 select-none">
          <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl text-center">
            <div className="w-14 h-14 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-indigo-600/30 mb-4">
              TPG
            </div>
            <h1 className="text-xl font-bold text-white">That Pop Culture Guy</h1>
            <p className="text-xs text-slate-400 mt-1">
              Enter your {activePin.length}-digit security PIN to unlock the platform
            </p>

            <div className={`flex justify-center gap-3.5 my-7 ${errorShake ? "animate-shake" : ""}`}>
              {Array.from({ length: activePin.length }).map((_, idx) => {
                const filled = idx < enteredPin.length;
                return (
                  <div
                    key={idx}
                    className={`w-4 h-4 rounded-full transition-all duration-150 ${
                      errorShake
                        ? "bg-rose-500 scale-110"
                        : filled
                        ? "bg-indigo-500 scale-110 shadow-md shadow-indigo-500/50"
                        : "bg-slate-800 border border-slate-700"
                    }`}
                  />
                );
              })}
            </div>

            {errorShake && (
              <p className="text-xs text-rose-400 font-medium -mt-3 mb-4">
                Incorrect PIN. Please try again.
              </p>
            )}

            <div className="grid grid-cols-3 gap-3">
              {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((digit) => (
                <button
                  key={digit}
                  type="button"
                  onClick={() => handleDigitPress(digit)}
                  className="h-14 rounded-2xl bg-slate-950 hover:bg-slate-800 active:bg-indigo-600 border border-slate-800 text-lg font-bold text-white transition flex items-center justify-center"
                >
                  {digit}
                </button>
              ))}
              <button
                type="button"
                onClick={() => setEnteredPin("")}
                className="h-14 rounded-2xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs font-semibold text-slate-400 hover:text-white transition flex items-center justify-center"
              >
                CLEAR
              </button>
              <button
                type="button"
                onClick={() => handleDigitPress("0")}

    function App() {

        try {
          sessionStorage.setItem(SESSION_UNLOCK_KEY, "true");
        } catch {}
      };

        } catch {}
      };

      const handleChangePin = () => {

        }

          alert("PIN must be 4 to 6 digits (numbers only).");
          return;
        }
        const cleanPin = newPin.trim();
        setActivePin(cleanPin);
        try {
          localStorage.setItem(PIN_STORAGE_KEY, cleanPin);
        } catch {}
        alert("PIN updated successfully!");
      };

      const [db, setDb] = useState(() => {

        } catch {
          return INITIAL_DATA;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        } catch (e) {
          console.error("Failed to save state", e);
        }
      }, [db]);

      const [activeTab, setActiveTab] = useState("DASHBOARD");
      const [taxEntityMode, setTaxEntityMode] = useState("SOLE_TRADER");

      // Modals State

      const [showAddConsigneeModal, setShowAddConsigneeModal] = useState(false);
      const [showAddExpenseModal, setShowAddExpenseModal] = useState(false);

      const [calcGross, setCalcGross] = useState(250);
      const [calcShipCharged, setCalcShipCharged] = useState(6.95);
      const [calcFee, setCalcFee] = useState(() => calculatePlatformFeeByPreset("EBAY", 250, 6.95));
      const [calcPostage, setCalcPostage] = useState(6.45);
      const [calcPack, setCalcPack] = useState(1.3);
      const [calcCogs, setCalcCogs] = useState(110);

      const handleSandboxPresetChange = (nextPreset) => {
        setCalcPlatformPreset(nextPreset);
        if (nextPreset !== "CUSTOM") {
          setCalcFee(calculatePlatformFeeByPreset(nextPreset, calcGross, calcShipCharged));
        }
      };

      const handleSandboxGrossChange = (val) => {

          setCalcFee(calculatePlatformFeeByPreset(calcPlatformPreset, val, calcShipCharged));
        }
      };

        setCalcShipCharged(val);

          setCalcFee(calculatePlatformFeeByPreset(calcPlatformPreset, calcGross, val));
        }
      };

      const sandboxResult = useMemo(
        () =>
          calculateSaleSplit({
            acquisitionType: calcType,
            grossSalePrice: calcGross,
            shippingChargedToBuyer: calcShipCharged,
            platformFeeAmount: calcFee,

          }),
        [calcType, calcGross, calcShipCharged, calcFee, calcPostage, calcPack, calcCogs]
      );

      // Deep Analytics & Financial Aggregations
      const deepStats = useMemo(() => calculateDeepAnalytics(db), [db]);

      const metrics = useMemo(() => {
        let consignment40Profit = 0;
        let owned100Profit = 0;
        let unpaidConsignee60Liability = 0;

        db.sales.forEach((s) => {
          const item = db.inventory.find((i) => i.id === s.inventoryItemId);
          if (item?.acquisitionType === "CONSIGNMENT") {
            consignment40Profit += Number(s.businessProfitShare);
            if (s.payoutStatus === "UNPAID") {
              unpaidConsignee60Liability += Number(s.consigneePayoutAmount);
            }
          } else {
            owned100Profit += Number(s.businessProfitShare);
          }
        });

        const deductibleOverheads = db.expenses
          .filter((e) => e.isTaxDeductible && !e.allocatedToItemSale)
          .reduce((acc, e) => acc + Number(e.amount), 0);

        const cashIngoings = db.cashFlow
          .filter((c) => c.type === "INGOING")
          .reduce((acc, c) => acc + Number(c.amount), 0);

        const cashOutgoings = db.cashFlow
          .filter((c) => c.type === "OUTGOING")
          .reduce((acc, c) => acc + Number(c.amount), 0);

        const totalBusinessSaleProfit = consignment40Profit + owned100Profit;
        const taxBreakdown = calculateUkTaxLiability(
          totalBusinessSaleProfit,
          deductibleOverheads,
          taxEntityMode
        );

        return {
          consignment40Profit: toGbp(consignment40Profit * 100),
          owned100Profit: toGbp(owned100Profit * 100),
          unpaidConsignee60Liability: toGbp(unpaidConsignee60Liability * 100),
          deductibleOverheads: toGbp(deductibleOverheads * 100),
          cashIngoings: toGbp(cashIngoings * 100),
          cashOutgoings: toGbp(cashOutgoings * 100),
          netCashFlow: toGbp((cashIngoings - cashOutgoings) * 100),
          taxBreakdown,
        };
      }, [db, taxEntityMode]);

      // Bulk eBay CSV Import Handler with Duplicate Prevention
      function handleBulkEbayImport(rows, fileName) {
        const newInventory = [...db.inventory];
        const newSales = [...db.sales];
        const newCashFlow = [...db.cashFlow];
        const newDocs = [...db.documents];
        const today = new Date().toISOString().split("T")[0];

        rows.forEach((r, idx) => {
          const isConsignment = r.acquisitionType === "CONSIGNMENT";

          if (r.mode === "STOCK") {
            const existingIdx = newInventory.findIndex(
              (i) => i.sku.toUpperCase() === r.sku.toUpperCase() || (r.platformItemId && i.platformItemId === r.platformItemId)
            );
            if (existingIdx !== -1) {
              newInventory[existingIdx] = {
                ...newInventory[existingIdx],
                listedPrice: Number(r.listedPrice),
                title: r.title,
                condition: r.condition,
              };
            } else {
              newInventory.unshift({
                id: `inv-eb-${Date.now()}-${idx}`,
                sku: r.sku,
                title: r.title,
                category: r.category,
                acquisitionType: r.acquisitionType,
                consigneeId: isConsignment ? r.consigneeId : null,
                acquisitionCost: isConsignment ? 0 : Number(r.acquisitionCost || 0),
                condition: r.condition,
                storageLocation: "eBay Vault",
                listedPrice: Number(r.listedPrice),
                status: "ACTIVE",
                platform: "EBAY",
                platformItemId: r.platformItemId,
                createdAt: today,
              });
            }
          } else {
            let matchedInvIdx = newInventory.findIndex(
              (i) => i.sku.toUpperCase() === r.sku.toUpperCase() || (r.platformItemId && i.platformItemId === r.platformItemId)
            );

            let invId;
            if (matchedInvIdx !== -1) {
              invId = newInventory[matchedInvIdx].id;
              newInventory[matchedInvIdx] = {
                ...newInventory[matchedInvIdx],
                status: isConsignment ? "PAYOUT_PENDING" : "COMPLETED",
              };
            } else {
              invId = `inv-eb-sale-${Date.now()}-${idx}`;
              newInventory.unshift({
                id: invId,
                sku: r.sku,
                title: r.title,
                category: r.category,
                acquisitionType: r.acquisitionType,
                consigneeId: isConsignment ? r.consigneeId : null,
                acquisitionCost: isConsignment ? 0 : Number(r.acquisitionCost || 0),
                condition: r.condition,
                storageLocation: "Dispatched",
                listedPrice: Number(r.grossSalePrice),
                status: isConsignment ? "PAYOUT_PENDING" : "COMPLETED",
                platform: "EBAY",
                platformItemId: r.platformItemId,
                createdAt: r.saleDate,
              });
            }

            const split = calculateSaleSplit({
              acquisitionType: r.acquisitionType,
              grossSalePrice: r.grossSalePrice,
              shippingChargedToBuyer: r.shippingChargedToBuyer,
              platformFeeAmount: r.platformFeeAmount,
              actualPostageCost: r.actualPostageCost,
              packagingCost: r.packagingCost,
              acquisitionCost: r.acquisitionCost,
              consigneeSplitPercentage: 60,
            });

            const saleId = `sale-eb-${Date.now()}-${idx}`;
            newSales.unshift({
              id: saleId,
              inventoryItemId: invId,
              saleDate: r.saleDate,
              buyerUsername: r.buyerUsername,
              grossSalePrice: Number(r.grossSalePrice),
              shippingChargedToBuyer: Number(r.shippingChargedToBuyer),
              platformFeeAmount: Number(r.platformFeeAmount),
              actualPostageCost: Number(r.actualPostageCost),
              packagingCost: Number(r.packagingCost),
              ownedStockCogs: isConsignment ? 0 : Number(r.acquisitionCost || 0),
              netProfit: split.netProfit,
              businessProfitShare: split.businessProfitShare,
              consigneePayoutAmount: split.consigneePayoutAmount,
              payoutStatus: isConsignment ? "UNPAID" : "NOT_APPLICABLE",
              payoutId: null,
            });

            newCashFlow.unshift({
              id: `cf-eb-in-${Date.now()}-${idx}`,
              entryDate: r.saleDate,
              type: "INGOING",
              source: "SALE_GROSS_RECEIPT",
              amount: split.totalIngoing,
              description: `eBay CSV Gross Receipt: [${r.sku}] ${r.title}`,
              saleRecordId: saleId,
            });

            const directOut = toGbp(
              toPence(r.platformFeeAmount) + toPence(r.actualPostageCost) + toPence(r.packagingCost)
            );
            if (directOut > 0) {
              newCashFlow.unshift({
                id: `cf-eb-out-${Date.now()}-${idx}`,
                entryDate: r.saleDate,
                type: "OUTGOING",
                source: "PLATFORM_FEE_DEDUCTION",
                amount: directOut,
                description: `eBay CSV Fees & P&P: [${r.sku}]`,
                saleRecordId: saleId,
              });
            }
          }
        });

        if (fileName) {
          newDocs.unshift({
            id: "doc-eb-" + Date.now(),
            fileName,
            documentType: "EBAY_CSV_REPORT",
            linkedTo: `Bulk Import (${rows.length} rows)`,
            fileSize: "142 KB",
            uploadedAt: today,
          });
        }

        setDb({
          ...db,
          inventory: newInventory,
          sales: newSales,
          cashFlow: newCashFlow,
          documents: newDocs,
        });
        setShowEbayImportModal(false);
      }
      // ==========================================
      // 10. STANDARD CRUD, VOID SALE & EXPORT HANDLERS
      // ==========================================
      function handleAddStock(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const acquisitionType = fd.get("acquisitionType");
        const consigneeId = acquisitionType === "CONSIGNMENT" ? fd.get("consigneeId") : null;

      function handleConfirmRecordSale(saleData) {
        const {
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          actualPostageCost,
          packagingCost,
          buyerUsername,
          proofFileName,
        } = saleData;

        const consignee = db.consignees.find((c) => c.id === saleModalItem.consigneeId);
        const split = calculateSaleSplit({
          acquisitionType: saleModalItem.acquisitionType,
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          actualPostageCost,
          packagingCost,
          acquisitionCost: saleModalItem.acquisitionCost,
          consigneeSplitPercentage: consignee ? Number(consignee.defaultSplit) : 60,
        });

        const isConsignment = saleModalItem.acquisitionType === "CONSIGNMENT";
        const today = new Date().toISOString().split("T")[0];
        const saleId = "sale-" + Date.now();

        const newSale = {
          id: saleId,
          inventoryItemId: saleModalItem.id,
          saleDate: today,
          buyerUsername,
          grossSalePrice,
          shippingChargedToBuyer,
          platformFeeAmount,
          actualPostageCost,
          packagingCost,
          ownedStockCogs: isConsignment ? 0 : Number(saleModalItem.acquisitionCost),
          netProfit: split.netProfit,
          businessProfitShare: split.businessProfitShare,
          consigneePayoutAmount: split.consigneePayoutAmount,
          payoutStatus: isConsignment ? "UNPAID" : "NOT_APPLICABLE",
          payoutId: null,
        };

        const updatedInventory = db.inventory.map((item) =>
          item.id === saleModalItem.id
            ? { ...item, status: isConsignment ? "PAYOUT_PENDING" : "COMPLETED" }
            : item
        );

        const newCashFlow = [
          {
            id: "cf-in-" + Date.now(),
            entryDate: today,
            type: "INGOING",
            source: "SALE_GROSS_RECEIPT",
            amount: split.totalIngoing,
            description: `Gross Receipt: [${saleModalItem.sku}] ${saleModalItem.title}`,
            saleRecordId: saleId,
          },
          ...db.cashFlow,
        ];

        const directOutgoings = toGbp(
          toPence(platformFeeAmount) + toPence(actualPostageCost) + toPence(packagingCost)
        );
        if (directOutgoings > 0) {
          newCashFlow.unshift({
            id: "cf-out-" + (Date.now() + 1),
            entryDate: today,
            type: "OUTGOING",
            source: "PLATFORM_FEE_DEDUCTION",
            amount: directOutgoings,
            description: `Fees, Postage & Packaging: [${saleModalItem.sku}]`,
            saleRecordId: saleId,
          });
        }

        const newDocs = [...db.documents];
        if (proofFileName) {
          newDocs.unshift({
            id: "doc-" + Date.now(),
            fileName: proofFileName,
            documentType: "PROOF_OF_POSTAGE",
            linkedTo: `Sale: ${saleModalItem.sku} (${fmtGBP(actualPostageCost)})`,
            fileSize: "410 KB",
            uploadedAt: today,
          });
        }

        setDb({
          ...db,
          inventory: updatedInventory,
          sales: [newSale, ...db.sales],
          cashFlow: newCashFlow,
          documents: newDocs,
        });
        setSaleModalItem(null);
      }

      function handleVoidSale(saleId) {
        const targetSale = db.sales.find((s) => s.id === saleId);
        if (!targetSale) return;
        if (targetSale.payoutStatus === "PAID") {
          alert("This sale has already been settled in a Consignee Payout batch and cannot be voided.");
          return;
        }
        const item = db.inventory.find((i) => i.id === targetSale.inventoryItemId);
        if (
          !confirm(
            `Void & Refund sale of [${item?.sku || "Item"}]?\nThis will restore the item to ACTIVE stock and remove its sale & fee cash-flow entries.`
          )
        ) {
          return;
        }

        setDb({
          ...db,
          sales: db.sales.filter((s) => s.id !== saleId),
          inventory: db.inventory.map((i) =>
            i.id === targetSale.inventoryItemId ? { ...i, status: "ACTIVE" } : i
          ),
          cashFlow: db.cashFlow.filter((cf) => cf.saleRecordId !== saleId),
        });
      }

      function handleSettleConsigneePayout(consigneeId) {
        const consignee = db.consignees.find((c) => c.id === consigneeId);
        const unpaidSales = db.sales.filter((s) => {
          const item = db.inventory.find((i) => i.id === s.inventoryItemId);
          return s.payoutStatus === "UNPAID" && item?.consigneeId === consigneeId;
        });

        if (unpaidSales.length === 0) return;

        const paymentRef = prompt(
          `Settle 60% Payout for ${consignee.name}?\nEnter UK Faster Payments Reference:`,
          `FP-${Math.floor(100000 + Math.random() * 900000)}`
        );
        if (!paymentRef) return;

        const totalPayout = toGbp(
          unpaidSales.reduce((acc, s) => acc + toPence(s.consigneePayoutAmount), 0)
        );
        const today = new Date().toISOString().split("T")[0];
        const payoutNumber = `PO-2026-${String(db.payouts.length + 101).padStart(4, "0")}`;

        const lineItems = unpaidSales.map((s) => {
          const item = db.inventory.find((i) => i.id === s.inventoryItemId);
          return {
            sku: item?.sku || "SKU",
            title: item?.title || "Item",
            saleDate: s.saleDate,
            grossPlusShipping: toGbp(toPence(s.grossSalePrice) + toPence(s.shippingChargedToBuyer)),
            deductions: toGbp(
              toPence(s.platformFeeAmount) + toPence(s.actualPostageCost) + toPence(s.packagingCost)
            ),
            netProfit: s.netProfit,
            consigneeShare60: s.consigneePayoutAmount,
            businessShare40: s.businessProfitShare,
          };
        });

        const newPayout = {
          id: "po-" + Date.now(),
          payoutNumber,
          consigneeId,
          consigneeName: consignee.name,
          consigneeEmail: consignee.email,
          consigneeBank: consignee.bankDetails,
          totalPayoutAmount: totalPayout,
          paidAt: today,
          paymentReference: paymentRef,
          items: lineItems,
        };

        const unpaidSaleIds = new Set(unpaidSales.map((s) => s.id));
        const unpaidItemIds = new Set(unpaidSales.map((s) => s.inventoryItemId));

        setDb({
          ...db,
          sales: db.sales.map((s) =>
            unpaidSaleIds.has(s.id) ? { ...s, payoutStatus: "PAID", payoutId: newPayout.id } : s
          ),
          inventory: db.inventory.map((i) =>
            unpaidItemIds.has(i.id) ? { ...i, status: "COMPLETED" } : i
          ),
          payouts: [newPayout, ...db.payouts],
          cashFlow: [
            {
              id: "cf-po-" + Date.now(),
              entryDate: today,
              type: "OUTGOING",
              source: "CONSIGNEE_PAYOUT",
              amount: totalPayout,
              description: `Consignee 60% Payout ${payoutNumber} to ${consignee.name} (Ref: ${paymentRef})`,
            },
            ...db.cashFlow,
          ],
          documents: [
            {
              id: "doc-po-" + Date.now(),
              fileName: `${payoutNumber}-${consignee.name.toLowerCase().replace(/\s+/g, "-")}.pdf`,
              documentType: "PAYOUT_STATEMENT_PDF",
              linkedTo: `Payout: ${payoutNumber}`,
              fileSize: "164 KB",
              uploadedAt: today,
            },
            ...db.documents,
          ],
        });

        setStatementModalPayout(newPayout);
      }

      function downloadUkAccountantCsv() {
        const headers = [
          "Sale Date",
          "SKU",
          "Item Title",
          "Acquisition Type",
          "Consignee Name",
          "Gross Sale (GBP)",
          "Shipping Charged (GBP)",
          "Platform Fees (GBP)",
          "Actual Postage (GBP)",
          "Packaging Cost (GBP)",
          "Owned Stock COGS (GBP)",
          "Item True Net Profit (GBP)",
          "Consignee 60% Payout (GBP)",
          "Taxable Business Profit Share (GBP)",
          "Payout Status",
        ];

        const rows = db.sales.map((s) => {
          const item = db.inventory.find((i) => i.id === s.inventoryItemId);
          const consignee = db.consignees.find((c) => c.id === item?.consigneeId);
          return [
            s.saleDate,
            item?.sku || "",
            `"${(item?.title || "").replace(/"/g, '""')}"`,
            item?.acquisitionType || "",
            `"${consignee ? consignee.name : "N/A - Owned Stock"}"`,
            Number(s.grossSalePrice).toFixed(2),
            Number(s.shippingChargedToBuyer).toFixed(2),
            Number(s.platformFeeAmount).toFixed(2),
            Number(s.actualPostageCost).toFixed(2),
            Number(s.packagingCost).toFixed(2),
            Number(s.ownedStockCogs).toFixed(2),
            Number(s.netProfit).toFixed(2),
            Number(s.consigneePayoutAmount).toFixed(2),
            Number(s.businessProfitShare).toFixed(2),
            s.payoutStatus,
          ];
        });

        const csvContent = [headers.join(","), ...rows.map((r) => r.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `tpcg-uk-tax-export-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

        const reader = new FileReader();

            const parsed = JSON.parse(evt.target.result);
            if (parsed.inventory && parsed.sales) {
              setDb(parsed);
              alert("Backup restored successfully!");

          } catch {
            alert("Invalid JSON backup file.");
          }
        };
        reader.readAsText(file);

                      <span className="text-white">{fmtGBP(metrics.owned100Profit)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Less: Deductible Overheads</span>
                      <span className="text-rose-400">-{fmtGBP(metrics.deductibleOverheads)}</span>
                    </div>
                    <div className="border-t border-slate-800 pt-2 flex justify-between font-bold">
                      <span>HMRC Taxable Net Profit</span>
                      <span className="text-emerald-400">
                        {fmtGBP(metrics.taxBreakdown.taxableNetProfit)}
                      </span>
                    </div>
                    <div className="border-t border-slate-800 pt-2 space-y-1 text-xs">
                      <div className="flex justify-between text-slate-300">
                        <span>
                          {taxEntityMode === "SOLE_TRADER" ? "Income Tax:" : "Corporation Tax:"}
                        </span>
                        <span>{fmtGBP(metrics.taxBreakdown.incomeOrCorpTax)}</span>
                      </div>
                      {taxEntityMode === "SOLE_TRADER" && (
                        <div className="flex justify-between text-slate-300">
                          <span>Class 4 National Insurance:</span>
                          <span>{fmtGBP(metrics.taxBreakdown.class4NationalInsurance)}</span>
                        </div>
                      )}
                    </div>
                    <div className="flex justify-between font-bold text-amber-400 pt-1">
                      <span>Total Estimated UK Tax Reserve</span>
                      <span>{fmtGBP(metrics.taxBreakdown.totalEstimatedTaxLiability)}</span>
                    </div>
                  </div>

                  <div className="mt-4 flex flex-wrap gap-2">
                    <button
                      onClick={downloadUkAccountantCsv}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg"
                    >
                      Download UK Tax CSV
                    </button>
                    <button
                      onClick={exportDatabaseBackupJson}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg"
                    >
                      Export Backup (.json)
                    </button>
                    <label className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3.5 py-2 rounded-lg cursor-pointer">
                      Import Backup
                      <input type="file" accept=".json" onChange={importDatabaseBackupJson} className="hidden" />
                    </label>
                    <button
                      onClick={resetDemoData}
                      className="bg-slate-900 hover:bg-slate-800 text-slate-400 text-xs px-3 py-2 rounded-lg border border-slate-800"
                    >
                      Reset Demo
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h2 className="text-base font-bold text-white mb-3">Document Management Vault</h2>
                  <div className="space-y-2 max-h-[380px] overflow-y-auto">
                    {db.documents.map((doc) => (
                      <div
                        key={doc.id}
                        className="bg-slate-950 border border-slate-800 rounded-lg p-3 flex items-center justify-between text-xs"
                      >
                        <div>
                          <span className="font-medium text-white block">{doc.fileName}</span>
                          <span className="text-slate-400">{doc.linkedTo} • {doc.uploadedAt}</span>
                        </div>
                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px]">
                          {doc.documentType}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ==========================================
              MODALS
             ========================================== */}
          {showEbayImportModal && (
            <EbayCsvImportModal
              consignees={db.consignees}
              onClose={() => setShowEbayImportModal(false)}
              onImportRows={handleBulkEbayImport}
            />
          )}

          {saleModalItem && (
            <RecordSaleModal
              item={saleModalItem}
              consignee={db.consignees.find((c) => c.id === saleModalItem.consigneeId)}
              onClose={() => setSaleModalItem(null)}
              onConfirm={handleConfirmRecordSale}
            />
          )}

          {editingItem && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
                <h3 className="text-lg font-bold text-white mb-1">Edit Stock Item / Reprice</h3>
                <p className="text-xs text-indigo-300 mb-4 font-mono">{editingItem.sku}</p>
                <form onSubmit={handleEditStockSave} className="space-y-3 text-sm">
                  <div>
                    <label className="text-xs text-slate-400">Item Title</label>
                    <input
                      name="title"
                      required
                      defaultValue={editingItem.title}
                      className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400">Listed Price (£)</label>
                      <input
                        name="listedPrice"
                        type="number"
                        step="0.01"
                        required
                        defaultValue={editingItem.listedPrice}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Storage Bin</label>
                      <input
                        name="storageLocation"
                        required
                        defaultValue={editingItem.storageLocation || "Vault A-01"}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-amber-300"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400">Condition</label>
                      <input
                        name="condition"
                        required
                        defaultValue={editingItem.condition}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Sales Channel</label>
                      <select
                        name="platform"
                        defaultValue={editingItem.platform || "EBAY"}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
                      >
                        <option value="EBAY">eBay UK (Biz)</option>
                        <option value="EBAY_PRIVATE">eBay UK (Private)</option>
                        <option value="WHATNOT">Whatnot UK</option>
                        <option value="CARDMARKET">Cardmarket</option>
                        <option value="VINTED">Vinted UK</option>
                        <option value="SHOPIFY">Shopify UK</option>
                        <option value="IN_PERSON_EVENT">In-Person Show</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="px-4 py-2 text-xs text-slate-400"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-lg"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAddStockModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 max-h-[92vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-white mb-3">Add Inventory Stock Item</h3>
                <form onSubmit={handleAddStock} className="space-y-3 text-sm">
                  <div className="grid grid-cols-3 gap-2">
                    <input name="sku" required placeholder="SKU (e.g. TCG-01)" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="storageLocation" required defaultValue="Vault A-01" placeholder="Storage Bin" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-amber-300" />
                    <select name="category" className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-white">
                      <option value="TRADING_CARDS">Trading Cards</option>
                      <option value="LEGO">LEGO</option>
                      <option value="ACTION_FIGURES">Figures</option>
                      <option value="FUNKO_POP">Funko Pop</option>
                      <option value="COMICS">Comics</option>
                      <option value="VIDEO_GAMES">Video Games</option>
                    </select>
                  </div>
                  <input name="title" required placeholder="Item Title" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <select name="acquisitionType" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
                      <option value="CONSIGNMENT">CONSIGNMENT (60/40)</option>
                      <option value="OWNED_STOCK">OWNED_STOCK (100%)</option>
                    </select>
                    <select name="consigneeId" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
                      {db.consignees.map((c) => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <input name="listedPrice" type="number" step="0.01" required placeholder="Price £" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="acquisitionCost" type="number" step="0.01" placeholder="Owned COGS £" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <select name="platform" className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-white">
                      <option value="EBAY">eBay UK (Biz)</option>
                      <option value="EBAY_PRIVATE">eBay UK (Private)</option>
                      <option value="WHATNOT">Whatnot UK</option>
                      <option value="CARDMARKET">Cardmarket</option>
                      <option value="VINTED">Vinted UK</option>
                      <option value="SHOPIFY">Shopify UK</option>
                      <option value="IN_PERSON_EVENT">In-Person Show</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input name="condition" required placeholder="Condition (e.g. PSA 10 / MISB)" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="platformItemId" placeholder="eBay Item ID (Optional)" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddStockModal(false)} className="px-4 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="bg-indigo-600 text-white text-xs font-medium px-4 py-2 rounded-lg">Save Item</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAddConsigneeModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 max-h-[92vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-white mb-3">New Consignee Account</h3>
                <form onSubmit={handleAddConsignee} className="space-y-3 text-sm">
                  <input name="name" required placeholder="Full Name *" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <input name="email" type="email" required placeholder="Email *" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="phone" placeholder="Phone" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <input name="bankDetails" required placeholder="Sort Code & Account No *" className="col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="defaultSplit" type="number" defaultValue="60" placeholder="Split %" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <input name="address" placeholder="UK Postal Address" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  <input name="notes" placeholder="Notes (e.g. Pokemon & LEGO specialist)" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  <div>
                    <label className="text-xs text-slate-400">Attach Signed Consignment Contract (PDF)</label>
                    <input name="agreementFile" type="file" className="w-full mt-1 text-xs text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:bg-slate-800 file:text-slate-200" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddConsigneeModal(false)} className="px-4 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="bg-indigo-600 text-white text-xs font-medium px-4 py-2 rounded-lg">Save Consignee</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAddExpenseModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 no-print">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 max-h-[92vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-white mb-3">Log Business Expense & Receipt</h3>
                <form onSubmit={handleAddExpense} className="space-y-3 text-sm">
                  <div className="grid grid-cols-2 gap-2">
                    <input name="merchant" required placeholder="Merchant (e.g. SafeStore) *" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                    <input name="amount" type="number" step="0.01" required placeholder="Amount (£) *" className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <select name="category" className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-white">
                      <option value="STORAGE_AND_RENT">Storage & Rent</option>
                      <option value="PACKAGING_SUPPLIES">Packaging Supplies</option>
                      <option value="PLATFORM_SUBSCRIPTIONS">Platform Subscriptions</option>
                      <option value="EVENT_TABLES_AND_TRAVEL">Event Tables & Travel</option>
                      <option value="EQUIPMENT_AND_HARDWARE">Equipment & Hardware</option>
                      <option value="ACCOUNTING_AND_LEGAL">Accounting & Legal</option>
                    </select>
                    <input name="expenseDate" type="date" defaultValue={new Date().toISOString().split("T")[0]} className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  </div>
                  <input name="description" required placeholder="Description *" className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white" />
                  <label className="flex items-center gap-2 text-xs text-slate-300">
                    <input name="allocatedToItemSale" type="checkbox" className="rounded" />
                    Already deducted inside an individual SaleRecord (prevent double tax deduction)
                  </label>
                  <div>
                    <label className="text-xs text-slate-400">Attach Receipt Image / PDF</label>
                    <input name="receiptFile" type="file" className="w-full mt-1 text-xs text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:bg-slate-800 file:text-slate-200" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAddExpenseModal(false)} className="px-4 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="bg-indigo-600 text-white text-xs font-medium px-4 py-2 rounded-lg">Save Expense</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {statementModalPayout && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="printable-area">
                  <div className="flex justify-between items-start border-b border-slate-200 pb-3">
                    <div>
                      <h2 className="text-xl font-black">THAT POP CULTURE GUY</h2>
                      <p className="text-xs font-bold text-indigo-700">60/40 CONSIGNMENT SETTLEMENT STATEMENT</p>
                    </div>
                    <div className="text-right text-xs text-slate-600">
                      <p className="font-bold text-slate-900">{statementModalPayout.payoutNumber}</p>
                      <p>Date: {statementModalPayout.paidAt}</p>
                      <p>Ref: {statementModalPayout.paymentReference}</p>
                    </div>
                  </div>
                  <div className="my-3 text-xs bg-slate-50 p-2.5 rounded border border-slate-200">
                    <p className="font-bold">{statementModalPayout.consigneeName} ({statementModalPayout.consigneeEmail})</p>
                    <p>{statementModalPayout.consigneeBank}</p>
                  </div>
                  <table className="w-full text-left text-xs border-collapse my-3">
                    <thead>
                      <tr className="border-b-2 border-slate-300">
                        <th className="py-1">SKU</th>
                        <th className="py-1">Title</th>
                        <th className="py-1">Gross+Ship</th>
                        <th className="py-1">Fees/P&P</th>
                        <th className="py-1">Net Profit</th>
                        <th className="py-1 text-right">Your 60%</th>
                      </tr>
                    </thead>
                    <tbody>
                      {statementModalPayout.items.map((it, idx) => (
                        <tr key={idx} className="border-b border-slate-200">
                          <td className="py-1.5 font-mono">{it.sku}</td>
                          <td className="py-1.5">{it.title}</td>
                          <td className="py-1.5">{fmtGBP(it.grossPlusShipping)}</td>
                          <td className="py-1.5 text-rose-600">-{fmtGBP(it.deductions)}</td>
                          <td className="py-1.5">{fmtGBP(it.netProfit)}</td>
                          <td className="py-1.5 text-right font-bold text-indigo-700">{fmtGBP(it.consigneeShare60)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <p className="text-right font-black text-base mt-3 border-t-2 border-slate-900 pt-2">
                    TOTAL PAYOUT PAID: {fmtGBP(statementModalPayout.totalPayoutAmount)}
                  </p>
                </div>
                <div className="flex justify-end gap-2 mt-4 no-print">
                  <button onClick={() => setStatementModalPayout(null)} className="px-4 py-2 text-xs text-slate-600">Close</button>
                  <button onClick={() => window.print()} className="bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-lg">Print / Save PDF</button>
                </div>
              </div>
            </div>
          )}

          {labelModalItems && (
            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl max-w-3xl w-full p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 no-print">
                  <h3 className="font-bold">Printable SKU Barcode Labels ({labelModalItems.length})</h3>
                  <div className="flex gap-2">
                    <button onClick={() => setLabelModalItems(null)} className="px-3 py-1.5 text-xs">Close</button>
                    <button onClick={() => window.print()} className="bg-indigo-600 text-white text-xs px-4 py-1.5 rounded-lg">🖨️ Print</button>
                  </div>
                </div>
                <div className="printable-area grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {labelModalItems.map((item) => (
                    <div key={item.id} className="label-card-print border-2 border-black rounded-xl p-3">
                      <div className="flex justify-between text-[10px] font-bold border-b border-black pb-1">
                        <span>THAT POP CULTURE GUY</span>
                        <span>BIN: {item.storageLocation || "VAULT-A1"}</span>
                      </div>
                      <p className="text-xs font-bold my-1.5">{item.title}</p>
                      <div className="flex justify-between text-[10px] text-slate-700 mb-1">
                        <span>COND: {item.condition}</span>
                        <span>{item.acquisitionType}</span>
                      </div>
                      <div className="flex justify-between items-baseline">
                        <span className="font-mono text-xs font-black">{item.sku}</span>
                        <span className="text-lg font-black">{fmtGBP(item.listedPrice)}</span>
                      </div>
                      <SvgBarcode value={item.sku} />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
