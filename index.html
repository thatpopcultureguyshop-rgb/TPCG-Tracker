    // Web Crypto API: PBKDF2 (100,000 iterations) + AES-GCM 256-Bit Encryption
    function bufToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToBuf(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function deriveAesKey(passphrase, saltUint8) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(String(passphrase)),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltUint8,
          iterations: 100000,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptDatabaseToVault(dbObject, passphrase) {
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveAesKey(passphrase, salt);
      const enc = new TextEncoder();
      const encodedData = enc.encode(JSON.stringify(dbObject));
      const cipherBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        encodedData
      );
      return JSON.stringify({
        v: 5,
        cipher: "AES-256-GCM",
        salt: bufToBase64(salt.buffer),
        iv: bufToBase64(iv.buffer),
        ct: bufToBase64(cipherBuffer),
      });
    }

    async function decryptVaultToDatabase(rawVaultJson, passphrase) {
      const payload = JSON.parse(rawVaultJson);
      const salt = new Uint8Array(base64ToBuf(payload.salt));
      const iv = new Uint8Array(base64ToBuf(payload.iv));
      const ct = base64ToBuf(payload.ct);
      const key = await deriveAesKey(passphrase, salt);
      const plainBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        ct
      );
      const dec = new TextDecoder();
      return JSON.parse(dec.decode(plainBuffer));
    }

    // ==========================================
    // 2. SMART CUSTOM SKU SCANNER & AUTO-GENERATOR
    // Con-(First 3 Letters of Consignee First Name)-(Number) e.g. Con-Jac-21
    // Business Owned Stock: TPCG-(4 Digit Number) e.g. TPCG-0001
    // ==========================================
    function getConsigneeSkuPrefix(nameOrConsignee) {
      if (!nameOrConsignee) return "CON";
      if (typeof nameOrConsignee === "object" && nameOrConsignee.skuPrefix) {
        return String(nameOrConsignee.skuPrefix).toUpperCase().slice(0, 3);
      }
      const rawName =
        typeof nameOrConsignee === "object" ? nameOrConsignee.name || "" : String(nameOrConsignee);
      const firstName = rawName.trim().split(/\s+/)[0] || "";
      const cleanLetters = firstName.replace(/[^A-Za-z]/g, "").toUpperCase();
      return (cleanLetters + "XXX").slice(0, 3);
    }

    function scanSkuAndMatchConsignee(rawSku, consignees = []) {
      const trimmed = String(rawSku || "").trim().toUpperCase();

      // Match Business Owned Stock: TPCG-0001
      const tpcgMatch = trimmed.match(/^TPCG[\-\s]?(\d+)$/i);
      if (tpcgMatch) {
        const num = parseInt(tpcgMatch[1], 10) || 1;
        return {
          matched: true,
          normalizedSku: `TPCG-${String(num).padStart(4, "0")}`,
          acquisitionType: "OWNED_STOCK",
          consigneeId: null,
          consigneeName: null,
          prefix: "TPCG",
          itemNumber: num,
        };
      }

      // Match Consignment Stock: Con-Jac-21
      const conMatch = trimmed.match(/^CON[\-\s]([A-Z]{3})[\-\s](\d+)$/i);
      if (conMatch) {
        const prefix3 = conMatch[1].toUpperCase();
        const itemNum = parseInt(conMatch[2], 10) || 1;
        const matchedConsignee = consignees.find(
          (c) => getConsigneeSkuPrefix(c) === prefix3
        );
        return {
          matched: true,
          normalizedSku: `CON-${prefix3}-${itemNum}`,
          acquisitionType: "CONSIGNMENT",
          consigneeId: matchedConsignee ? matchedConsignee.id : "",
          consigneeName: matchedConsignee ? matchedConsignee.name : null,
          prefix: prefix3,
          itemNumber: itemNum,
        };
      }

      return {
        matched: false,
        normalizedSku: trimmed,
        acquisitionType: null,
        consigneeId: null,
        consigneeName: null,
        prefix: null,
        itemNumber: null,
      };
    }

    function generateNextCustomSku(acquisitionType, consigneeObj, inventory = [], sales = []) {
      const allSkus = [
        ...inventory.map((i) => i.sku || ""),
        ...sales.map((s) => s.sku || ""),
      ];

      if (acquisitionType === "OWNED_STOCK") {
        let maxNum = 0;
        allSkus.forEach((s) => {
          const m = String(s).trim().match(/^TPCG[\-\s]?(\d+)$/i);
          if (m) {
            const n = parseInt(m[1], 10);
            if (n > maxNum) maxNum = n;
          }
        });
        return `TPCG-${String(maxNum + 1).padStart(4, "0")}`;
      }

      const prefix3 = getConsigneeSkuPrefix(consigneeObj);
      let maxConNum = 0;
      const regex = new RegExp(`^CON[\\-\\s]${prefix3}[\\-\\s](\\d+)$`, "i");
      allSkus.forEach((s) => {
        const m = String(s).trim().match(regex);
        if (m) {
          const n = parseInt(m[1], 10);
          if (n > maxConNum) maxConNum = n;
        }
      });
      return `CON-${prefix3}-${maxConNum + 1}`;
    }

    // ==========================================
    // 3. DATE, 14-DAY PAYOUT, 30-DAY REPRICE & CONTRACT HELPERS
    // ==========================================
    const MONTHS_MAP = {
      jan: "01", feb: "02", mar: "03", apr: "04", may: "05", jun: "06",
      jul: "07", aug: "08", sep: "09", oct: "10", nov: "11", dec: "12"
    };

    function normalizeUkDateToIso(rawDate) {
      if (!rawDate) return new Date().toISOString().split("T")[0];
      const str = String(rawDate).trim().replace(/"/g, "");
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0, 10);

      const textMonth = str.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[a-z]*[\s\-,]+(\d{2,4})/);
      if (textMonth) {
        const day = String(textMonth[1]).padStart(2, "0");
        const mon = MONTHS_MAP[textMonth[2].toLowerCase()] || "01";
        let yr = String(textMonth[3]);
        if (yr.length === 2) yr = "20" + yr;
        return `${yr}-${mon}-${day}`;
      }

      const slashMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (slashMatch) {
        let p1 = Number(slashMatch[1]);
        let p2 = Number(slashMatch[2]);
        let year = String(slashMatch[3]);
        if (year.length === 2) year = "20" + year;
        let day = p1;
        let month = p2;
        if (p1 <= 12 && p2 > 12) {
          month = p1;
          day = p2;
        }
        return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        return parsed.toISOString().split("T")[0];
      }
      return new Date().toISOString().split("T")[0];
    }

    function addDaysToIso(isoDate, days = 14) {
      const clean = normalizeUkDateToIso(isoDate);
      const d = new Date(clean + "T12:00:00Z");
      if (isNaN(d.getTime())) return clean;
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().split("T")[0];
    }

    function getDaysSinceIso(isoDate) {
      const clean = normalizeUkDateToIso(isoDate);
      const dStart = new Date(clean + "T00:00:00Z");
      const todayIso = new Date().toISOString().split("T")[0];
      const dToday = new Date(todayIso + "T00:00:00Z");
      if (isNaN(dStart.getTime())) return 0;
      return Math.max(0, Math.round((dToday - dStart) / (1000 * 60 * 60 * 24)));
    }

    function getPayoutDueMeta(dueDateIso) {
      const todayIso = new Date().toISOString().split("T")[0];
      const dToday = new Date(todayIso + "T00:00:00Z");
      const dDue = new Date(normalizeUkDateToIso(dueDateIso) + "T00:00:00Z");
      const diffDays = Math.round((dDue - dToday) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return {
          status: "OVERDUE",
          days: diffDays,
          label: `OVERDUE (${Math.abs(diffDays)}d ago)`,
          badgeClass: "bg-rose-500/20 text-rose-300 border border-rose-500/40",
        };
      }
      if (diffDays === 0) {
        return {
          status: "DUE_TODAY",
          days: 0,
          label: "DUE TODAY",
          badgeClass: "bg-amber-500/20 text-amber-300 border border-amber-500/40",
        };
      }
      if (diffDays <= 3) {
        return {
          status: "DUE_SOON",
          days: diffDays,
          label: `Due in ${diffDays}d (${dueDateIso})`,
          badgeClass: "bg-amber-500/20 text-amber-200 border border-amber-500/30",
        };
      }
      return {
        status: "SCHEDULED",
        days: diffDays,
        label: `Due ${dueDateIso} (${diffDays}d)`,
        badgeClass: "bg-slate-800 text-slate-300 border border-slate-700",
      };
    }

    // Evaluates 30-Day Owned Stock Repricing Cycle & Consignment Clauses 2 & 5

          daysListed,
          daysSinceLastPriceCheck,
          next30DayDueIso,
          isOwned30DayDue: false,
          stage: "DISCOUNT_ELIGIBLE",

          canDiscount15: true,
          isEarlyWithdrawalWindow: true,
          isAbandonedEligible: false,
        };
      }
      return {
        daysListed,
        daysSinceLastPriceCheck,
        next30DayDueIso,
        isOwned30DayDue: false,
        stage: "ACTIVE_TERM",
        label: `Day ${daysListed}/90 (£5/item Early Exit Fee)`,
        badgeClass: "bg-indigo-500/10 text-indigo-300 border border-indigo-500/30",
        canDiscount15: false,
        isEarlyWithdrawalWindow: true,
        isAbandonedEligible: false,
      };
    }

    function formatUkSortCode(raw) {
      const digits = String(raw || "").replace(/\D/g, "").slice(0, 6);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return `${digits.slice(0, 2)}-${digits.slice(2)}`;
      return `${digits.slice(0, 2)}-${digits.slice(2, 4)}-${digits.slice(4, 6)}`;
    }

    function maskSensitiveText(text, isMasked) {
      if (!isMasked || !text) return text;
      const s = String(text);
      if (s.length <= 4) return "••••";
      return "••••••" + s.slice(-4);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (e) =>
          resolve({
            name: file.name,
            mimeType: file.type || "application/octet-stream",
            sizeKb: `${Math.max(1, Math.round(file.size / 1024))} KB`,
            dataUrl: e.target.result,
          });
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    const UK_POSTAGE_PRESETS = [

    function calculatePlatformFeeByPreset(presetKey, gross, shipping) {
      const preset = UK_PLATFORM_PRESETS[presetKey] || UK_PLATFORM_PRESETS.EBAY;

    // ==========================================
    // 4. REALIZED PROFIT & STRICT UK HMRC TAX ENGINE
    // Consignments: 60% Consignor / 40% Business Split after Fees & Postage.
    // Owned Stock: 100% Business Profit after Buy-In Cost (COGS), Fees & Postage.
    // ==========================================
    function calculateSaleSplit({
      acquisitionType,
      grossSalePrice,
      shippingChargedToBuyer,
      platformFeeAmount,
      adFeeAmount = 0,
      actualPostageCost,
      packagingCost,
      acquisitionCost = 0,
      consigneeSplitPercentage = 60,
    }) {
      const grossP = toPence(grossSalePrice);
      const shipInP = toPence(shippingChargedToBuyer);
      const feeP = toPence(platformFeeAmount);
      const adFeeP = toPence(adFeeAmount);
      const postOutP = toPence(actualPostageCost);
      const packP = toPence(packagingCost);
      const cogsP = acquisitionType === "OWNED_STOCK" ? toPence(acquisitionCost) : 0;

      const totalIngoingP = grossP + shipInP;
      const totalDirectCostsP = feeP + adFeeP + postOutP + packP + cogsP;
      const netProfitP = totalIngoingP - totalDirectCostsP;

      if (acquisitionType === "OWNED_STOCK") {
        return {
          totalIngoing: toGbp(totalIngoingP),
          totalDirectCosts: toGbp(totalDirectCostsP),
          netProfit: toGbp(netProfitP),
          businessProfitShare: toGbp(netProfitP),
          consigneePayoutAmount: 0,
        };
      }

      if (netProfitP <= 0) {
        return {
          totalIngoing: toGbp(totalIngoingP),
          totalDirectCosts: toGbp(totalDirectCostsP),
          netProfit: toGbp(netProfitP),
          businessProfitShare: toGbp(netProfitP),
          consigneePayoutAmount: 0,
        };
      }

      const consigneeP = Math.round((netProfitP * consigneeSplitPercentage) / 100);
      const businessP = netProfitP - consigneeP;

      return {
        totalIngoing: toGbp(totalIngoingP),
        totalDirectCosts: toGbp(totalDirectCostsP),
        netProfit: toGbp(netProfitP),
        businessProfitShare: toGbp(businessP),
        consigneePayoutAmount: toGbp(consigneeP),
      };
    }

    function calculateUkTaxLiability(totalBusinessSaleProfit, deductibleOverheadExpenses, entityStructure = "SOLE_TRADER") {
      const taxableNetProfit = Math.max(0, totalBusinessSaleProfit - deductibleOverheadExpenses);
      if (taxableNetProfit === 0) {
        return {
          entityStructure,
          totalBusinessSaleProfit,
          deductibleOverheadExpenses,
          taxableNetProfit: 0,
          incomeOrCorpTax: 0,
          class4NationalInsurance: 0,
          totalEstimatedTaxLiability: 0,
          effectiveTaxRatePercent: 0,
          netProfitAfterTax: 0,
        };
      }

      if (entityStructure === "LIMITED_COMPANY") {
        let corpTax = 0;
        if (taxableNetProfit <= 50000) {
          corpTax = taxableNetProfit * 0.19;
        } else if (taxableNetProfit >= 250000) {
          corpTax = taxableNetProfit * 0.25;
        } else {
          const mainRateTax = taxableNetProfit * 0.25;
          const marginalRelief = (250000 - taxableNetProfit) * (3 / 200);
          corpTax = mainRateTax - marginalRelief;
        }
        const roundedCorp = Number(corpTax.toFixed(2));
        return {
          entityStructure,
          totalBusinessSaleProfit,
          deductibleOverheadExpenses,
          taxableNetProfit: Number(taxableNetProfit.toFixed(2)),
          incomeOrCorpTax: roundedCorp,
          class4NationalInsurance: 0,
          totalEstimatedTaxLiability: roundedCorp,
          effectiveTaxRatePercent: Number(((roundedCorp / taxableNetProfit) * 100).toFixed(2)),
          netProfitAfterTax: Number((taxableNetProfit - roundedCorp).toFixed(2)),
        };
      }

      let personalAllowance = 12570;
      if (taxableNetProfit > 100000) {
        personalAllowance = Math.max(0, 12570 - (taxableNetProfit - 100000) / 2);
      }
      const taxableAfterAllowance = Math.max(0, taxableNetProfit - personalAllowance);
      const basicBandLimit = 37700;
      const higherThreshold = 125140;

      let incomeTax = 0;
      if (taxableAfterAllowance > 0) {
        const basicPortion = Math.min(taxableAfterAllowance, basicBandLimit);
        incomeTax += basicPortion * 0.2;

        if (taxableAfterAllowance > basicBandLimit) {
          const higherBandMax = higherThreshold - personalAllowance - basicBandLimit;
          const higherPortion = Math.min(taxableAfterAllowance - basicBandLimit, Math.max(0, higherBandMax));
          incomeTax += higherPortion * 0.4;
        }
        if (taxableNetProfit > higherThreshold) {
          incomeTax += (taxableNetProfit - higherThreshold) * 0.45;
        }
      }

      let class4Nic = 0;
      if (taxableNetProfit > 12570) {
        const mainNicBand = Math.min(taxableNetProfit, 50270) - 12570;
        class4Nic += mainNicBand * 0.06;
        if (taxableNetProfit > 50270) {
          class4Nic += (taxableNetProfit - 50270) * 0.02;
        }
      }

      const rIncome = Number(incomeTax.toFixed(2));
      const rNic = Number(class4Nic.toFixed(2));
      const totalTax = Number((rIncome + rNic).toFixed(2));

      return {
        entityStructure,
        totalBusinessSaleProfit,
        deductibleOverheadExpenses,
        taxableNetProfit: Number(taxableNetProfit.toFixed(2)),
        incomeOrCorpTax: rIncome,
        class4NationalInsurance: rNic,
        totalEstimatedTaxLiability: totalTax,
        effectiveTaxRatePercent: Number(((totalTax / taxableNetProfit) * 100).toFixed(2)),
        netProfitAfterTax: Number((taxableNetProfit - totalTax).toFixed(2)),
      };
    }
    // ==========================================
    // 5. SMART-SKU & MULTI-QTY EBAY UK CSV PARSER
    // Automatically scans Con-XXX-## and TPCG-#### SKUs
    // ==========================================
    function parseCsvLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function cleanCurrency(val) {
      if (!val) return 0;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : Math.abs(num);
    }

    function cleanIntQty(val, fallback = 1) {
      if (val === undefined || val === null || val === "") return fallback;
      const parsed = parseInt(String(val).replace(/[^0-9]/g, ""), 10);
      return isNaN(parsed) || parsed < 1 ? fallback : parsed;
    }

    function normalizeConditionLabel(rawCond) {
      const c = String(rawCond || "").toLowerCase();
      if (c.includes("psa") || c.includes("cgc") || c.includes("bgs") || c.includes("graded")) {
        return "Graded (PSA / CGC / BGS)";
      }
      if (c.includes("brand new") || c.includes("new") || c.includes("sealed") || c.includes("misb")) {
        return "Brand New (Sealed / MISB)";
      }
      if (c.includes("like new") || c.includes("mint") || c.includes("nm")) {
        return "Like New / Mint";
      }
      if (c.includes("acceptable") || c.includes("damaged") || c.includes("incomplete")) {
        return "Used - Acceptable / Incomplete";
      }
      if (c.includes("good") && !c.includes("very")) {
        return "Used - Good";
      }
      return "Used - Very Good";
    }

    function guessCategoryFromTitle(title) {
      const t = (title || "").toLowerCase();
      if (t.includes("pokemon") || t.includes("pokémon") || t.includes("pikachu") || t.includes("psa") || t.includes("charizard") || t.includes("tcg") || t.includes("magic") || t.includes("umbreon") || t.includes("rayquaza") || t.includes("card")) return "TRADING_CARDS";
      if (t.includes("lego") || t.includes("minifig") || t.includes("ninjago") || t.includes("ucs") || t.includes("brick")) return "LEGO";
      if (t.includes("funko") || t.includes("pop!")) return "FUNKO_POP";
      if (t.includes("hot toys") || t.includes("hasbro") || t.includes("figure") || t.includes("sideshow") || t.includes("neca")) return "ACTION_FIGURES";
      if (t.includes("cgc") || t.includes("comic") || t.includes("marvel") || t.includes("asm")) return "COMICS";
      if (t.includes("gameboy") || t.includes("nintendo") || t.includes("playstation") || t.includes("sega") || t.includes("zelda") || t.includes("xbox")) return "VIDEO_GAMES";
      return "TRADING_CARDS";
    }

    function parseEbayCsvReport(
      csvText,
      enforcedMode = "AUTO",
      consignees = [],
      defaultAcquisitionType = "CONSIGNMENT",
      defaultConsigneeId = "",
      defaultFeePreset = "EBAY",
      defaultAdPct = 0,
      defaultPostage = 3.29,
      defaultPackaging = 0.85
    ) {
      const rawLines = csvText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);

      let headerIdx = 0;
      for (let i = 0; i < Math.min(rawLines.length, 25); i++) {
        const lower = rawLines[i].toLowerCase();
        if (
          lower.includes("item number") ||
          lower.includes("item title") ||
          lower.includes("title") ||
          lower.includes("custom label") ||
          lower.includes("order number") ||
          lower.includes("sold for")
        ) {
          headerIdx = i;
          break;
        }
      }

      if (rawLines.length <= headerIdx + 1) return { mode: "STOCK", rows: [] };

      const headers = parseCsvLine(rawLines[headerIdx]).map((h) => h.toLowerCase());
      const findCol = (keywords) =>
        headers.findIndex((h) => keywords.some((kw) => h.includes(kw)));

      const colItemId = findCol(["item number", "item id"]);
      const colTitle = findCol(["item title", "title", "product"]);
      const colSku = findCol(["custom label", "sku"]);
      const colAvailQty = findCol(["available quantity", "quantity", "qty"]);
      const colStartPrice = findCol(["start price", "buy it now price", "listed price", "price"]);
      const colSoldFor = findCol(["sold for", "sale price", "gross", "total price"]);
      const colShipping = findCol(["postage and packaging", "shipping", "delivery"]);
      const colFvfFixed = findCol(["final value fee - fixed", "fixed fee"]);
      const colFvfVar = findCol(["final value fee - variable", "platform fee", "transaction fee"]);
      const colAdFee = findCol(["promoted listings", "ad fee", "advertising"]);
      const colCondition = findCol(["condition"]);
      const colNotes = findCol(["condition description", "seller notes", "notes", "remarks", "flaws"]);
      const colBuyer = findCol(["buyer username", "buyer name", "buyer"]);
      const colSaleDate = findCol(["sale date", "order date", "paid on date", "date"]);
      const colOrderNum = findCol(["order number"]);

      let isSalesReport = colOrderNum !== -1 || colSoldFor !== -1 || colSaleDate !== -1;
      if (enforcedMode === "STOCK") isSalesReport = false;
      if (enforcedMode === "SALES") isSalesReport = true;

      const rows = [];

      for (let i = headerIdx + 1; i < rawLines.length; i++) {
        const cols = parseCsvLine(rawLines[i]);
        if (cols.length < 2) continue;

        const title = (colTitle !== -1 ? cols[colTitle] : "") || "";
        if (!title || title.toLowerCase().includes("total") || title.length < 2) continue;

        const itemId = (colItemId !== -1 ? cols[colItemId] : "") || `EB-${Date.now()}-${i}`;
        const orderNumber = colOrderNum !== -1 ? cols[colOrderNum] : "";
        const rawSku = (colSku !== -1 ? cols[colSku] : "") || `EBAY-${String(itemId).slice(-5)}`;

        // Scan SKU for Con-XXX-## or TPCG-####
        const skuScan = scanSkuAndMatchConsignee(rawSku, consignees);
        const sku = skuScan.normalizedSku || rawSku.toUpperCase();

        let acqType = defaultAcquisitionType;
        let matchedConsigneeId = defaultAcquisitionType === "CONSIGNMENT" ? defaultConsigneeId : null;

        if (skuScan.matched) {
          acqType = skuScan.acquisitionType;
          matchedConsigneeId =
            skuScan.acquisitionType === "CONSIGNMENT"
              ? skuScan.consigneeId || defaultConsigneeId
              : null;
        } else if (sku.startsWith("TPCG-") || sku.startsWith("OWN-")) {
          acqType = "OWNED_STOCK";
          matchedConsigneeId = null;
        }

        const parsedQty = cleanIntQty(colAvailQty !== -1 ? cols[colAvailQty] : 1, 1);

        const price = cleanCurrency(
          colSoldFor !== -1 ? cols[colSoldFor] : colStartPrice !== -1 ? cols[colStartPrice] : 0
        );
        const shippingCharged = cleanCurrency(colShipping !== -1 ? cols[colShipping] : 0);

        let fee = 0;
        const csvFee =
          cleanCurrency(colFvfFixed !== -1 ? cols[colFvfFixed] : 0) +
          cleanCurrency(colFvfVar !== -1 ? cols[colFvfVar] : 0);

        if (csvFee > 0) {
          fee = csvFee;
        } else if (isSalesReport && price > 0) {
          fee = calculatePlatformFeeByPreset(defaultFeePreset, price, shippingCharged);
        }

        let adFee = cleanCurrency(colAdFee !== -1 ? cols[colAdFee] : 0);
        if (adFee === 0 && isSalesReport && Number(defaultAdPct) > 0) {
          adFee = Number((((price + shippingCharged) * Number(defaultAdPct)) / 100).toFixed(2));
        }

        const rawDateStr = colSaleDate !== -1 ? cols[colSaleDate] : "";
        const rawCondStr = colCondition !== -1 ? cols[colCondition] : "";
        const rawRemarks = colNotes !== -1 ? cols[colNotes] : "";

        rows.push({
          tempId: `row-${i}-${Date.now()}`,
          mode: isSalesReport ? "SALE" : "STOCK",
          orderNumber,
          sku,
          skuScanMatched: skuScan.matched,
          skuMatchedConsigneeName: skuScan.consigneeName,
          skuPrefixDetected: skuScan.prefix,
          title,
          quantity: parsedQty,
          quantitySold: parsedQty,
          platformItemId: itemId,
          category: guessCategoryFromTitle(title),
          condition: normalizeConditionLabel(rawCondStr),
          remarks: rawRemarks || "",
          acquisitionType: acqType,
          consigneeId: matchedConsigneeId,
          acquisitionCost: 0,
          minimumReserve: 0,
          listedPrice: price || 0,
          grossSalePrice: price || 0,
          shippingChargedToBuyer: shippingCharged,
          platformFeeAmount: Number(fee.toFixed(2)),
          adFeeAmount: Number(adFee.toFixed(2)),
          actualPostageCost: Number(Number(defaultPostage).toFixed(2)),
          packagingCost: Number(Number(defaultPackaging).toFixed(2)),
          buyerUsername: (colBuyer !== -1 ? cols[colBuyer] : "") || "ebay_uk_buyer",
          saleDate: normalizeUkDateToIso(rawDateStr),
        });
      }

      if (isSalesReport) {
        rows.sort((a, b) => b.saleDate.localeCompare(a.saleDate));
      }

      return { mode: isSalesReport ? "SALE" : "STOCK", rows };
    }

    // ==========================================
    // 6. AUTOMATED NOTIFICATIONS & 30-DAY REPRICING ENGINE
    // ==========================================
    function buildNotificationsList(db) {
      const owned30DayAlerts = [];
      const consignment60DayAlerts = [];
      const consignment90To120Alerts = [];
      const payoutDueAlerts = [];

      db.inventory.forEach((item) => {
        const meta = getStockTimelineAndRepriceMeta(item);
        if (item.acquisitionType === "OWNED_STOCK" && meta.isOwned30DayDue) {
          owned30DayAlerts.push({ ...item, meta });
        } else if (item.acquisitionType === "CONSIGNMENT") {
          if (meta.stage === "ABANDONED_ELIGIBLE" || meta.stage === "TERM_ENDED") {
            consignment90To120Alerts.push({ ...item, meta });
          } else if (meta.canDiscount15 && meta.daysSinceLastPriceCheck >= 30) {
            consignment60DayAlerts.push({ ...item, meta });
          }
        }
      });

      db.sales.forEach((s) => {
        if (s.acquisitionType === "CONSIGNMENT" && s.payoutStatus !== "PAID" && s.payoutStatus !== "RETURNED") {
          const dueIso = s.payoutDueDate || addDaysToIso(s.saleDate, 14);
          const dueMeta = getPayoutDueMeta(dueIso);
          if (dueMeta.days <= 3) {
            const remOwed = toGbp(
              Math.max(0, toPence(s.consigneePayoutAmount || 0) - toPence(s.amountPaidSoFar || 0))
            );
            if (remOwed > 0) {
              payoutDueAlerts.push({ ...s, dueIso, dueMeta, remOwed });
            }
          }
        }
      });

      const totalCount =
        owned30DayAlerts.length +
        consignment60DayAlerts.length +
        consignment90To120Alerts.length +
        payoutDueAlerts.length;

      return {
        totalCount,
        owned30DayAlerts,
        consignment60DayAlerts,
        consignment90To120Alerts,
        payoutDueAlerts,
      };
    }

    // ==========================================
    // 7. MULTI-QUANTITY DEEP ANALYTICS ENGINE
    // ==========================================
    function calculateDeepAnalytics(db) {
      const activeItems = db.inventory;

      const activeUnitsCount = activeItems.reduce(
        (acc, i) => acc + Math.max(1, Number(i.quantity ?? 1)),
        0
      );

      // Exclude returned sales from active sold unit counts
      const validSales = db.sales.filter((s) => s.payoutStatus !== "RETURNED");

      const soldUnitsCount = validSales.reduce(
        (acc, s) => acc + Math.max(1, Number(s.quantitySold ?? 1)),
        0
      );
      const totalUnits = activeUnitsCount + soldUnitsCount;

      const activeConsigned = activeItems.filter((i) => i.acquisitionType === "CONSIGNMENT");
      const activeOwned = activeItems.filter((i) => i.acquisitionType === "OWNED_STOCK");

      const activePortfolioValue = activeItems.reduce(
        (a, i) => a + Number(i.listedPrice || 0) * Math.max(1, Number(i.quantity ?? 1)),
        0
      );
      const activeConsignedValue = activeConsigned.reduce(
        (a, i) => a + Number(i.listedPrice || 0) * Math.max(1, Number(i.quantity ?? 1)),
        0
      );
      const activeOwnedRetailValue = activeOwned.reduce(
        (a, i) => a + Number(i.listedPrice || 0) * Math.max(1, Number(i.quantity ?? 1)),
        0
      );
      // Unsold Owned Stock COGS is tracked as tied-up capital, NEVER deducted from tax until sold
      const tiedUpOwnedCogs = activeOwned.reduce(
        (a, i) => a + Number(i.acquisitionCost || 0) * Math.max(1, Number(i.quantity ?? 1)),
        0
      );

      let projectedActiveBusinessProfit = 0;
      activeItems.forEach((item) => {
        const qty = Math.max(1, Number(item.quantity ?? 1));
        const consignee = db.consignees.find((c) => c.id === item.consigneeId);
        const estFee = calculatePlatformFeeByPreset(item.platform || "EBAY", item.listedPrice, 0);
        const estSplit = calculateSaleSplit({
          acquisitionType: item.acquisitionType,
          grossSalePrice: item.listedPrice,
          shippingChargedToBuyer: 0,
          platformFeeAmount: estFee,
          adFeeAmount: 0,
          actualPostageCost: 0,
          packagingCost: 0.85,
          acquisitionCost: item.acquisitionCost,
          consigneeSplitPercentage: consignee ? Number(consignee.defaultSplit) : 60,
        });
        projectedActiveBusinessProfit += estSplit.businessProfitShare * qty;
      });

      const sellThroughRate =
        totalUnits > 0 ? Number(((soldUnitsCount / totalUnits) * 100).toFixed(1)) : 0;

      let totalGrossSales = 0;
      let totalShippingCharged = 0;
      let totalPlatformFees = 0;
      let totalAdFees = 0;
      let totalActualPostage = 0;
      let totalPackaging = 0;
      let totalSoldOwnedCogs = 0;
      let totalNetProfit = 0;
      let totalBusinessKeep = 0;
      let totalConsigneeShare = 0;
      let consignmentSaleProfitTotal = 0;
      let ownedSaleProfitTotal = 0;
      let totalDaysToSell = 0;
      let soldWithDatesCount = 0;

      const categoryStats = {};
      const channelStats = {};

      validSales.forEach((s) => {
        const qtySold = Math.max(1, Number(s.quantitySold ?? 1));
        const g = Number(s.grossSalePrice || 0);
        const shipIn = Number(s.shippingChargedToBuyer || 0);
        const fee = Number(s.platformFeeAmount || 0);
        const adFee = Number(s.adFeeAmount || 0);
        const postOut = Number(s.actualPostageCost || 0);
        const packOut = Number(s.packagingCost || 0);
        const cogs = Number(s.ownedStockCogs || 0);
        const net = Number(s.netProfit || 0);
        const biz = Number(s.businessProfitShare || 0);
        const con = Number(s.consigneePayoutAmount || 0);
        const acqType = s.acquisitionType || "CONSIGNMENT";

        totalGrossSales += g;
        totalShippingCharged += shipIn;
        totalPlatformFees += fee;
        totalAdFees += adFee;
        totalActualPostage += postOut;
        totalPackaging += packOut;
        totalSoldOwnedCogs += cogs;
        totalNetProfit += net;
        totalBusinessKeep += biz;
        totalConsigneeShare += con;

        if (acqType === "CONSIGNMENT") {
          consignmentSaleProfitTotal += biz;
        } else {
          ownedSaleProfitTotal += biz;
        }

        if (s.listedDate && s.saleDate) {
          const d1 = new Date(normalizeUkDateToIso(s.listedDate));
          const d2 = new Date(normalizeUkDateToIso(s.saleDate));
          const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)));
          if (!isNaN(diffDays)) {
            totalDaysToSell += diffDays;
            soldWithDatesCount++;
          }
        }

        const cat = s.category || "OTHER";
        if (!categoryStats[cat]) {
          categoryStats[cat] = {
            category: cat,
            soldCount: 0,
            activeCount: 0,
            gross: 0,
            netProfit: 0,
            businessKeep: 0,
          };
        }
        categoryStats[cat].soldCount += qtySold;
        categoryStats[cat].gross += g;
        categoryStats[cat].netProfit += net;
        categoryStats[cat].businessKeep += biz;

        const plat = s.platform || "EBAY";
        if (!channelStats[plat]) {
          channelStats[plat] = {
            platform: plat,
            count: 0,
            gross: 0,
            fees: 0,
            adFees: 0,
            businessKeep: 0,
          };
        }
        channelStats[plat].count += qtySold;
        channelStats[plat].gross += g + shipIn;
        channelStats[plat].fees += fee;
        channelStats[plat].adFees += adFee;
        channelStats[plat].businessKeep += biz;
      });

      activeItems.forEach((i) => {
        const cat = i.category || "OTHER";
        const qty = Math.max(1, Number(i.quantity ?? 1));
        if (!categoryStats[cat]) {
          categoryStats[cat] = {
            category: cat,
            soldCount: 0,
            activeCount: 0,
            gross: 0,
            netProfit: 0,
            businessKeep: 0,
          };
        }
        categoryStats[cat].activeCount += qty;
      });

      const totalTopLineIngoing = totalGrossSales + totalShippingCharged;
      const combinedFeesAndAds = totalPlatformFees + totalAdFees;
      const feeBleedRatePercent =
        totalTopLineIngoing > 0
          ? Number(((combinedFeesAndAds / totalTopLineIngoing) * 100).toFixed(2))
          : 0;
      const adBleedRatePercent =
        totalTopLineIngoing > 0 ? Number(((totalAdFees / totalTopLineIngoing) * 100).toFixed(2)) : 0;
      const shippingRecoveryBalance = toGbp(
        (totalShippingCharged - (totalActualPostage + totalPackaging)) * 100
      );
      const ownedStockRoiPercent =
        totalSoldOwnedCogs > 0
          ? Number(((ownedSaleProfitTotal / totalSoldOwnedCogs) * 100).toFixed(1))
          : 0;
      const businessKeepRatePercent =
        totalTopLineIngoing > 0
          ? Number(((totalBusinessKeep / totalTopLineIngoing) * 100).toFixed(1))
          : 0;
      const avgDaysToSell =
        soldWithDatesCount > 0 ? Number((totalDaysToSell / soldWithDatesCount).toFixed(1)) : 0;

      const postageAndPackTotal = totalActualPostage + totalPackaging;
      const waterfall = {
        feesPct:
          totalTopLineIngoing > 0
            ? Number(((combinedFeesAndAds / totalTopLineIngoing) * 100).toFixed(1))
            : 0,
        postagePackPct:
          totalTopLineIngoing > 0
            ? Number(((postageAndPackTotal / totalTopLineIngoing) * 100).toFixed(1))
            : 0,
        cogsPct:
          totalTopLineIngoing > 0
            ? Number(((totalSoldOwnedCogs / totalTopLineIngoing) * 100).toFixed(1))
            : 0,
        consigneePct:
          totalTopLineIngoing > 0
            ? Number(((totalConsigneeShare / totalTopLineIngoing) * 100).toFixed(1))
            : 0,
        businessKeepPct:
          totalTopLineIngoing > 0
            ? Number(((totalBusinessKeep / totalTopLineIngoing) * 100).toFixed(1))
            : 0,
      };

      const agingInventory = activeItems
        .map((item) => {
          const timeline = getStockTimelineAndRepriceMeta(item);
          return { ...item, daysListed: timeline.daysListed, timeline };
        })
        .sort((a, b) => b.daysListed - a.daysListed);

      const consigneeLeaderboard = db.consignees
        .map((c) => {
          const cActiveUnits = db.inventory
            .filter((i) => i.consigneeId === c.id)
            .reduce((acc, i) => acc + Math.max(1, Number(i.quantity ?? 1)), 0);
          const cSales = validSales.filter((s) => s.consigneeId === c.id);
          const soldUnits = cSales.reduce(
            (acc, s) => acc + Math.max(1, Number(s.quantitySold ?? 1)),
            0
          );
          const grossGenerated = cSales.reduce((a, s) => a + Number(s.grossSalePrice || 0), 0);
          const business40Earned = cSales.reduce((a, s) => a + Number(s.businessProfitShare || 0), 0);
          const consignee60Earned = cSales.reduce(
            (a, s) => a + Number(s.consigneePayoutAmount || 0),
            0
          );
          return {
            id: c.id,
            name: c.name,
            skuPrefix: getConsigneeSkuPrefix(c),
            activeItemsCount: cActiveUnits,
            soldCount: soldUnits,
            grossGenerated: toGbp(grossGenerated * 100),
            business40Earned: toGbp(business40Earned * 100),
            consignee60Earned: toGbp(consignee60Earned * 100),
          };
        })
        .sort((a, b) => b.business40Earned - a.business40Earned);

      return {
        totalItems: totalUnits,
        activeCount: activeUnitsCount,
        soldCount: soldUnitsCount,
        sellThroughRate,
        activePortfolioValue: toGbp(activePortfolioValue * 100),
        activeConsignedValue: toGbp(activeConsignedValue * 100),
        activeOwnedRetailValue: toGbp(activeOwnedRetailValue * 100),
        tiedUpOwnedCogs: toGbp(tiedUpOwnedCogs * 100),
        projectedActiveBusinessProfit: toGbp(projectedActiveBusinessProfit * 100),
        totalTopLineIngoing: toGbp(totalTopLineIngoing * 100),
        totalGrossSales: toGbp(totalGrossSales * 100),
        totalShippingCharged: toGbp(totalShippingCharged * 100),
        totalPlatformFees: toGbp(totalPlatformFees * 100),
        totalAdFees: toGbp(totalAdFees * 100),
        combinedFeesAndAds: toGbp(combinedFeesAndAds * 100),
        totalActualPostage: toGbp(totalActualPostage * 100),
        totalPackaging: toGbp(totalPackaging * 100),
        totalSoldOwnedCogs: toGbp(totalSoldOwnedCogs * 100),
        totalBusinessKeep: toGbp(totalBusinessKeep * 100),
        feeBleedRatePercent,
        adBleedRatePercent,
        shippingRecoveryBalance,
        ownedStockRoiPercent,
        businessKeepRatePercent,
        avgDaysToSell,
        consignmentSaleProfitTotal: toGbp(consignmentSaleProfitTotal * 100),
        ownedSaleProfitTotal: toGbp(ownedSaleProfitTotal * 100),
        totalConsigneeShare: toGbp(totalConsigneeShare * 100),
        waterfall,
        categoryBreakdown: Object.values(categoryStats).sort((a, b) => b.businessKeep - a.businessKeep),
        channelBreakdown: Object.values(channelStats).sort((a, b) => b.gross - a.gross),
        agingInventory,
        consigneeLeaderboard,
      };
    }

    // ==========================================
    // 8. DETERMINISTIC SVG BARCODE GENERATOR
    // ==========================================
    function SvgBarcode({ value }) {
      const bars = useMemo(() => {
        const str = `*${(value || "SKU").toUpperCase()}*`;
        const pattern = [];
        for (let i = 0; i < str.length; i++) {
          const code = str.charCodeAt(i);
          pattern.push((code % 3) + 1);
          pattern.push(((code >> 2) % 2) + 1);
          pattern.push(((code >> 4) % 3) + 1);
          pattern.push(1);
        }
        return pattern;
      }, [value]);

      let currentX = 0;
      const rects = [];
      bars.forEach((width, idx) => {
        if (idx % 2 === 0) {
          rects.push({ x: currentX, width: width * 1.8 });
        }
        currentX += width * 1.8;
      });

      return (
        <svg
          viewBox={`0 0 ${Math.max(currentX, 100)} 36`}
          className="w-full h-9"
          preserveAspectRatio="none"
        >
          {rects.map((r, i) => (
            <rect key={i} x={r.x} y="0" width={r.width} height="36" fill="currentColor" />
          ))}
        </svg>
      );
    }

    const CRC32_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    })();

    function crc32Bytes(uint8Arr) {
      let crc = 0xffffffff;
      for (let i = 0; i < uint8Arr.length; i++) {
        crc = CRC32_TABLE[(crc ^ uint8Arr[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function dataUrlToUint8Array(dataUrl) {
      try {
        const parts = String(dataUrl).split(",");
        const base64 = parts.length > 1 ? parts[1] : parts[0];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      } catch {
        return new TextEncoder().encode("");
      }
    }

    function buildUncompressedZipBlob(fileEntries) {
      const enc = new TextEncoder();
      const localChunks = [];
      const centralChunks = [];
      let offset = 0;

      fileEntries.forEach((entry) => {
        const nameBytes = enc.encode(entry.path);
        const dataBytes =
          entry.bytes instanceof Uint8Array
            ? entry.bytes
            : enc.encode(String(entry.content || ""));
        const crc = crc32Bytes(dataBytes);
        const size = dataBytes.length;

        const localHeader = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(localHeader.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true); // UTF-8 filename flag
        lv.setUint16(8, 0, true); // STORE (no compression)
        lv.setUint16(10, 0, true);
        lv.setUint16(12, 0x5421, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, size, true);
        lv.setUint32(22, size, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        localHeader.set(nameBytes, 30);

        localChunks.push(localHeader, dataBytes);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(centralHeader.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, 0, true);
        cv.setUint16(14, 0x5421, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, size, true);
        cv.setUint32(24, size, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        centralHeader.set(nameBytes, 46);

        centralChunks.push(centralHeader);
        offset += localHeader.length + size;
      });

      const centralSize = centralChunks.reduce((a, c) => a + c.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, fileEntries.length, true);
      ev.setUint16(10, fileEntries.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);
      ev.setUint16(20, 0, true);

      return new Blob([...localChunks, ...centralChunks, eocd], {
        type: "application/zip",
      });
    }

    function extractMasterJsonFromZipBuffer(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);
      const dec = new TextDecoder();
      let pos = 0;

      while (pos + 30 <= bytes.length) {
        const sig = view.getUint32(pos, true);
        if (sig !== 0x04034b50) break;
        const method = view.getUint16(pos + 8, true);
        const compSize = view.getUint32(pos + 18, true);
        const nameLen = view.getUint16(pos + 26, true);
        const extraLen = view.getUint16(pos + 28, true);
        const fileName = dec.decode(bytes.subarray(pos + 30, pos + 30 + nameLen));
        const dataStart = pos + 30 + nameLen + extraLen;
        const dataEnd = dataStart + compSize;

        if (
          method === 0 &&
          (fileName.endsWith("MASTER-RESTORE-ARCHIVE.json") || fileName.endsWith(".json"))
        ) {
          const jsonText = dec.decode(bytes.subarray(dataStart, dataEnd));
          const parsed = JSON.parse(jsonText);
          if (parsed && parsed.inventory && parsed.sales) {
            return parsed;
          }
        }
        pos = dataEnd;
      }
      throw new Error("Could not find MASTER-RESTORE-ARCHIVE.json inside the ZIP file.");
    }

    // ==========================================
    // 12. SMART WEEKLY EBAY UK CSV IMPORTER MODAL
    // Scans Con-XXX-## & TPCG-#### SKUs and handles Multi-Quantity
    // ==========================================
    function EbayCsvImportModal({
      consignees,
      existingInventory,
      existingSales,
      initialEnforcedMode = "AUTO",
      onClose,
      onImportRows,
    }) {
      const [enforcedMode, setEnforcedMode] = useState(initialEnforcedMode);
      const [defaultAcqType, setDefaultAcqType] = useState("CONSIGNMENT");
      const [defaultConsigneeId, setDefaultConsigneeId] = useState(consignees[0]?.id || "");
      const [defaultFeePreset, setDefaultFeePreset] = useState("EBAY");
      const [defaultAdPct, setDefaultAdPct] = useState(0);
      const [defaultPostage, setDefaultPostage] = useState(3.29);
      const [defaultPackaging, setDefaultPackaging] = useState(0.85);

      const [rawCsvText, setRawCsvText] = useState("");
      const [parsedRows, setParsedRows] = useState([]);
      const [reportMode, setReportMode] = useState("STOCK");
      const [sourceFileObj, setSourceFileObj] = useState(null);

      const annotateSyncRows = (rows, mode) => {
        return rows.map((r) => {
          const skuScan = scanSkuAndMatchConsignee(r.sku, consignees);
          const matchInSales = existingSales.find(
            (s) =>
              (r.orderNumber && s.orderNumber && r.orderNumber === s.orderNumber && s.sku.toUpperCase() === r.sku.toUpperCase()) ||
              (r.platformItemId &&
                s.platformItemId &&
                s.platformItemId !== "N/A" &&
                s.platformItemId === r.platformItemId &&
                s.saleDate === r.saleDate &&
                s.buyerUsername === r.buyerUsername)
          );
          const matchInStock = existingInventory.find(
            (i) =>
              (r.platformItemId &&
                i.platformItemId &&
                i.platformItemId !== "N/A" &&
                i.platformItemId === r.platformItemId) ||
              (i.sku && i.sku.toUpperCase() === r.sku.toUpperCase())
          );

          const resolvedAcqType = matchInStock
            ? matchInStock.acquisitionType
            : skuScan.matched
            ? skuScan.acquisitionType
            : r.acquisitionType;

          const resolvedConsigneeId =
            resolvedAcqType === "CONSIGNMENT"
              ? matchInStock?.consigneeId || skuScan.consigneeId || r.consigneeId
              : null;

          if (mode === "STOCK") {
            if (matchInStock) {
              return {
                ...r,
                acquisitionType: resolvedAcqType,
                consigneeId: resolvedConsigneeId,
                acquisitionCost: matchInStock.acquisitionCost || r.acquisitionCost || 0,
                condition: matchInStock.condition || r.condition,
                remarks: matchInStock.remarks || r.remarks || "",
                syncAction: "UPDATE_STOCK",
                syncLabel: `🔄 Update Stock (Qty: ${r.quantity})`,
              };
            }
            if (matchInSales) {
              return { ...r, syncAction: "SKIP_SOLD", syncLabel: "⏭️ Already Sold (Skip)" };
            }
            return {
              ...r,
              acquisitionType: resolvedAcqType,
              consigneeId: resolvedConsigneeId,
              syncAction: "NEW_STOCK",
              syncLabel: skuScan.matched
                ? `✨ Auto-SKU Matched (${r.sku})`
                : `✨ New Stock (Qty: ${r.quantity})`,
            };
          } else {
            if (matchInSales) {
              return { ...r, syncAction: "SKIP_DUPLICATE", syncLabel: "⏭️ Duplicate Sale (Skip)" };
            }
            if (matchInStock) {
              const currentQty = Math.max(1, Number(matchInStock.quantity ?? 1));
              const soldQty = Math.max(1, Number(r.quantitySold ?? 1));
              const leftQty = Math.max(0, currentQty - soldQty);
              return {
                ...r,
                acquisitionType: resolvedAcqType,
                consigneeId: resolvedConsigneeId,
                acquisitionCost: Number(matchInStock.acquisitionCost || 0) * soldQty,
                condition: matchInStock.condition || r.condition,
                remarks: matchInStock.remarks || r.remarks || "",
                syncAction: "MOVE_TO_SOLD",
                syncLabel:
                  leftQty > 0
                    ? `🔥 Sell ${soldQty} of ${currentQty} (${leftQty} Stay in Stock)`
                    : `🔥 Sell All (${soldQty}) → Move to Sold`,
              };
            }
            return {
              ...r,
              acquisitionType: resolvedAcqType,
              consigneeId: resolvedConsigneeId,
              syncAction: "NEW_SALE",
              syncLabel: skuScan.matched
                ? `💷 Auto-SKU Sale (${r.sku})`
                : `💷 New Direct Sale (Qty: ${r.quantitySold})`,
            };
          }
        });
      };

      const runParserOnText = (text, modeOverride) => {
        if (!text) return;
        const result = parseEbayCsvReport(
          text,
          modeOverride,
          consignees,
          defaultAcqType,
          defaultConsigneeId,
          defaultFeePreset,
          defaultAdPct,
          defaultPostage,
          defaultPackaging
        );
        setReportMode(result.mode);
        setParsedRows(annotateSyncRows(result.rows, result.mode));
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const dataUrlObj = await readFileAsDataUrl(file);
        setSourceFileObj(dataUrlObj);

        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          setRawCsvText(text);
          runParserOnText(text, enforcedMode);
        };
        reader.readAsText(file);
      };

      const handleModeSwitch = (newMode) => {
        setEnforcedMode(newMode);
        if (rawCsvText) {
          runParserOnText(rawCsvText, newMode);
        }
      };

      const handleApplyBulkDefaultsToPreview = () => {
        setParsedRows((prev) =>
          prev.map((r) => {
            const skuScan = scanSkuAndMatchConsignee(r.sku, consignees);
            const fee =
              defaultFeePreset !== "CUSTOM"
                ? calculatePlatformFeeByPreset(
                    defaultFeePreset,
                    r.grossSalePrice,
                    r.shippingChargedToBuyer
                  )
                : r.platformFeeAmount;
            const adFee =
              Number(defaultAdPct) >= 0
                ? Number(
                    (
                      ((Number(r.grossSalePrice) + Number(r.shippingChargedToBuyer)) *
                        Number(defaultAdPct)) /
                      100
                    ).toFixed(2)
                  )
                : r.adFeeAmount;
            return {
              ...r,
              acquisitionType: skuScan.matched ? skuScan.acquisitionType : defaultAcqType,
              consigneeId: skuScan.matched
                ? skuScan.consigneeId || defaultConsigneeId
                : defaultAcqType === "CONSIGNMENT"
                ? defaultConsigneeId
                : null,
              platformFeeAmount: fee,
              adFeeAmount: adFee,
              actualPostageCost: Number(defaultPostage),
              packagingCost: Number(defaultPackaging),
            };
          })
        );
      };

      const updateRowField = (tempId, field, value) => {
        setParsedRows((prev) =>
          prev.map((r) => {
            if (r.tempId !== tempId) return r;
            const next = { ...r, [field]: value };
            if (field === "sku") {
              const scan = scanSkuAndMatchConsignee(value, consignees);
              if (scan.matched) {
                next.sku = scan.normalizedSku;
                next.acquisitionType = scan.acquisitionType;
                next.consigneeId = scan.consigneeId;
              }
            }
            return next;
          })
        );
      };

      const actionableRows = parsedRows.filter(
        (r) => r.syncAction !== "SKIP_SOLD" && r.syncAction !== "SKIP_DUPLICATE"

    // ==========================================
    // 13. EBAY RETURN & CREDIT DECLARATION MODAL
    // Tracks return postage charged by eBay, eBay credit given, and restocks item
    // ==========================================
    function DeclareReturnModal({ sale, onClose, onConfirmReturn }) {
      const [returnPostageCost, setReturnPostageCost] = useState(3.29);
      const [returnEbayCredit, setReturnEbayCredit] = useState(sale.platformFeeAmount || 0);
      const [restockToInventory, setRestockToInventory] = useState(true);
      const [triggerClause4Clawback, setTriggerClause4Clawback] = useState(
        sale.payoutStatus === "PAID" || Number(sale.amountPaidSoFar || 0) > 0
      );
      const [returnNotes, setReturnNotes] = useState("");

      const netReturnCost = toGbp(
        toPence(sale.actualPostageCost || 0) +
          toPence(returnPostageCost || 0) -
          toPence(returnEbayCredit || 0)
      );

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirmReturn({
          saleId: sale.id,
          returnPostageCost: Number(returnPostageCost || 0),
          returnEbayCredit: Number(returnEbayCredit || 0),
          restockToInventory,
          triggerClause4Clawback,
          returnNotes,
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 no-print">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
            <h3 className="text-lg font-bold text-white mb-1">
              ↩️ Declare eBay Return, Postage & Credit
            </h3>
            <p className="text-xs text-indigo-300 mb-4">
              [{sale.sku}] {sale.title} (Qty: {sale.quantitySold || 1})
            </p>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">
                    Return Postage Charged by eBay (£)
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    value={returnPostageCost}
                    onChange={(e) => setReturnPostageCost(e.target.value)}
                    className="w-full bg-slate-950 border border-rose-500/40 rounded-lg px-3 py-2 text-rose-300 font-bold text-sm"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">
                    eBay Fee / Postage Credit Received (£)
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    value={returnEbayCredit}
                    onChange={(e) => setReturnEbayCredit(e.target.value)}
                    className="w-full bg-slate-950 border border-emerald-500/40 rounded-lg px-3 py-2 text-emerald-300 font-bold text-sm"
                  />
                </div>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1">
                <div className="flex justify-between text-slate-400">
                  <span>Original Outbound Postage:</span>
                  <span className="text-rose-300">-{fmtGBP(sale.actualPostageCost)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>eBay Return Label Charged:</span>
                  <span className="text-rose-300">-{fmtGBP(returnPostageCost)}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>eBay Credit Refunded to You:</span>
                  <span className="text-emerald-300">+{fmtGBP(returnEbayCredit)}</span>
                </div>
                <div className="border-t border-slate-800 pt-1.5 flex justify-between font-bold text-white">
                  <span>Net Return Impact on Business:</span>
                  <span className={netReturnCost > 0 ? "text-rose-400" : "text-emerald-400"}>
                    {netReturnCost > 0 ? `-${fmtGBP(netReturnCost)} Loss` : `+${fmtGBP(Math.abs(netReturnCost))} Credit`}
                  </span>
                </div>
              </div>

              <label className="flex items-center gap-2 text-slate-200 cursor-pointer pt-1">
                <input
                  type="checkbox"
                  checked={restockToInventory}
                  onChange={(e) => setRestockToInventory(e.target.checked)}
                  className="rounded"
                />
                Add returned quantity ({sale.quantitySold || 1}) back into Active Stock
              </label>

              {sale.acquisitionType === "CONSIGNMENT" && Number(sale.amountPaidSoFar || 0) > 0 && (
                <label className="flex items-center gap-2 text-amber-300 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={triggerClause4Clawback}
                    onChange={(e) => setTriggerClause4Clawback(e.target.checked)}
                    className="rounded"
                  />
                  Clause 4 Clawback: Flag {fmtGBP(sale.amountPaidSoFar)} 60% payout to be returned by Consignor within 14 days
                </label>
              )}

              <input
                type="text"
                placeholder="Return reason / notes (e.g. Buyer changed mind / damaged in transit)"
                value={returnNotes}
                onChange={(e) => setReturnNotes(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"
              />

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-400">
                  Cancel
                </button>
                <button
                  type="submit"
                  className="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-4 py-2 rounded-lg"
                >
                  Confirm Return & Adjust Ledger
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }
